name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate
        run: make validate

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bardic_torch
        ports:
          - 3306:3306
        # The image's entrypoint runs a temporary server without networking while it initialises, so only a
        # TCP ping means the real server is up.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_MYSQL_ADMIN_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: make test-integration-external
