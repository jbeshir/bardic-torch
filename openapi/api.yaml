      examples:
        - display_name: Morwen
          role: contributor

    MyRevisionSummary:
      type: object
      description: |
        One of the caller's own revisions, drafts included. `title` is the title or name the caller's document
        gives the entity; `entity` is null for a new entity's draft, and once a new entity's placeholder is
        deleted. `base_revision_id` is the revision's base now, and `submitted_base_revision_id` the base it was
        submitted on, which a moderator's rebase never changes.
      additionalProperties: false
      required:
        - id
        - status
        - entity_type
        - entity
        - title
        - summary
        - source
        - author
        - created_at
        - submitted_at
        - reviewed_at
        - review_note
        - base_revision_id
        - submitted_base_revision_id
      properties:
        id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        status:
          $ref: "#/components/schemas/RevisionStatus"
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity:
          oneOf:
            - $ref: "#/components/schemas/EditorEntityRef"
            - type: "null"
        title:
          type: string
          examples:
            - Midwinter Revel
        summary:
          $ref: "#/components/schemas/RevisionSummaryText"
        source:
          $ref: "#/components/schemas/RevisionSource"
        author:
          $ref: "#/components/schemas/AuthorRef"
        created_at:
          type: string
          format: date-time
          examples:
            - "2026-10-01T09:00:00Z"
        submitted_at:
          type: [string, "null"]
          format: date-time
          examples:
            - "2026-10-01T09:10:00Z"
        reviewed_at:
          type: [string, "null"]
          format: date-time
          examples:
            - null
        review_note:
          type: [string, "null"]
          description: A moderator's note to the author on approving or rejecting the revision.
          examples:
            - null
        base_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 46
        submitted_base_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 46
      examples:
        - id: 51
          status: pending
          entity_type: event
          entity:
            slug: midwinter-revel
            collection_id: null
            is_new: false
          title: Midwinter Revel
          summary: Describe the revel.
          source: user
          author:
            display_name: Morwen
            role: contributor
          created_at: "2026-10-01T09:00:00Z"
          submitted_at: "2026-10-01T09:10:00Z"
          reviewed_at: null
          review_note: null
          base_revision_id: 46
          submitted_base_revision_id: 46

    MyRevision:
      type: object
      description: |
        One of the caller's own revisions with its views: `snapshot` is the caller's view of what they submitted
        (what they typed shown as they typed it, what they received from the current document shown as it is
        public now, hidden aliases never), `base_snapshot` the same view of the base it was submitted on, and
        `changed_fields` the snapshot's top-level fields that differ from the base's. For an approved revision
        both are the public views. `pending_references` are the caller's own pending new terms and persons the
        revision references. Moderator flags are never shown here.
      additionalProperties: false
      required:
        - id
