    PieceSnapshot:
      type: object
      description: |
        The view of a piece snapshot: the piece's editor-owned fields as the revision set them, with references
        to entities that are public now, and visible links.
      additionalProperties: false
      required:
        - title
        - kind
        - secondary_kinds
        - conservation_status
        - conservation_source_url
        - is_stub
        - notes_md
        - version_notes_md
        - licensing_status
        - licensing_notes_md
        - licence
        - historical_source_md
        - period_start
        - period_end
        - aliases
        - terms
        - credits
        - relations
        - links
      properties:
        title:
          $ref: "#/components/schemas/PieceSummary/properties/title"
        kind:
          $ref: "#/components/schemas/PieceKind"
        secondary_kinds:
          $ref: "#/components/schemas/PieceSummary/properties/secondary_kinds"
        conservation_status:
          $ref: "#/components/schemas/ConservationStatus"
        conservation_source_url:
          type: [string, "null"]
          description: The source supporting the conservation status.
          examples:
            - https://example.org/assessments/kettle
        is_stub:
          $ref: "#/components/schemas/PieceSummary/properties/is_stub"
        notes_md:
          $ref: "#/components/schemas/Piece/properties/notes_md"
        version_notes_md:
          $ref: "#/components/schemas/Piece/properties/version_notes_md"
        licensing_status:
          $ref: "#/components/schemas/LicensingStatus"
        licensing_notes_md:
          $ref: "#/components/schemas/Piece/properties/licensing_notes_md"
        licence:
          $ref: "#/components/schemas/Piece/properties/licence"
        historical_source_md:
          $ref: "#/components/schemas/Piece/properties/historical_source_md"
        period_start:
          $ref: "#/components/schemas/Piece/properties/period_start"
        period_end:
          $ref: "#/components/schemas/Piece/properties/period_end"
        aliases:
          $ref: "#/components/schemas/Piece/properties/aliases"
        terms:
          type: array
          description: The public terms the piece was classified with, in the snapshot's order.
          items:
            $ref: "#/components/schemas/PieceTerm"
        credits:
          type: array
          description: |
            The snapshot's credits, in order. A credit to a person who is not public or prefers not to have a page
            now is left out entirely.
          items:
            $ref: "#/components/schemas/PieceCredit"
        relations:
          type: array
          description: The piece's relations to other pieces that are public now; a snapshot holds outgoing ones only.
          items:
            $ref: "#/components/schemas/SnapshotPieceRelation"
        links:
          type: array
          description: The snapshot's links that are not hidden now, in order, with no system state such as liveness.
          items:
            $ref: "#/components/schemas/SnapshotPieceLink"
      examples:
        - title: The Copper Kettle
          kind: song
          secondary_kinds: []
          conservation_status: endangered
          conservation_source_url: null
          is_stub: false
          notes_md: null
          version_notes_md: null
          licensing_status: unknown
          licensing_notes_md: null
          licence: null
          historical_source_md: null
          period_start: null
          period_end: null
          aliases: []
          terms: []
          credits: []
          relations: []
          links: []

