            name: The Northmarch Songbook
          locator: p. 12
          liveness: ok
          last_checked_at: null
          archived_url: null
          roles: [lyrics, sheet_music]
          performances: []

    PiecePerformance:
      type: object
      description: |
        A recorded performance of a piece. Performers who are not public or prefer not to have a page are left
        out.
      additionalProperties: false
      required: [year, uploader, description_verbatim, event, performers]
      properties:
        year:
          type: [integer, "null"]
          description: The year of the performance.
          examples:
            - 2025
        uploader:
          type: [string, "null"]
          description: Who uploaded the recording.
          examples:
            - Northmarch Bards
        description_verbatim:
          type: string
          description: The performance's description as originally recorded.
          examples:
            - Sung by Wren at Midwinter Revel 2025
        event:
          description: The public event the performance was at.
          oneOf:
            - $ref: "#/components/schemas/EventSummary"
            - type: "null"
        performers:
          type: array
          description: The performers, in order.
          items:
            $ref: "#/components/schemas/PersonSummary"
      examples:
        - year: 2025
          uploader: null
          description_verbatim: Sung by Wren at Midwinter Revel 2025
          event: null
          performers: []

    ConservationChange:
      type: object
      description: A change of a piece's conservation status.
      additionalProperties: false
      required: [conservation_status, reason, source_url, at]
      properties:
