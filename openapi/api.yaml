openapi: 3.1.0
info:
  title: Bardic Torch API
  description: |
    API behind bardictorch.org.

    Conventions:
    - Request and response bodies are JSON (`application/json`); property names are snake_case.
    - Response objects are closed (`additionalProperties: false`): clients can rely on receiving exactly the
      documented properties.
    - Errors use the `Error` body, whose `code` is stable and machine-readable; `message` is for humans.
    - A path no operation matches gets 404 `not_found`; a known path with an unsupported method gets 405
      `method_not_allowed` with an `Allow` header listing the supported methods. Neither authenticates the
      request.
    - Request headers over 16 KiB get a plain-text 431 from the server, before any operation runs.
    - A request whose path is not validly percent-encoded gets a plain-text 400 from the server, before any
      operation runs.
    - operationIds are camelCase.
  version: 1.0.0
  contact:
    name: Bardic Torch
    url: https://bardictorch.org
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.bardictorch.org
    description: Production server

security:
  - auth0Bearer: []
  - apiTokenBearer: []

tags:
  - name: Health
    description: Liveness and readiness checks for the deployment platform
  - name: Users
    description: The caller's account
  - name: Moderation
    description: |
      Actions and views reserved for moderators, in an interactive (Auth0) session: a moderator's API token gets
      403 `api_token_not_allowed`, because a leaked long-lived token must not moderate or read moderator views.
  - name: Contact
    description: The public contact form, which needs no account
  - name: API tokens
    description: Personal API tokens for programmatic access
  - name: Revisions
    description: |
      The caller's own edits: editable documents, drafts, submissions, withdrawals and reverts, and their
      revisions. An API token acts with contributor powers, whatever its user's role.
  - name: Catalogue
    description: |
      Public reads of the catalogue: pieces, persons, the terms that classify them, and the collections and
      events that record them

paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness check
      description: |
        Reports that the process is serving requests. Always 200 while the server runs; it does not check
        dependencies. Credentials are ignored.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags:
        - Health
      summary: Readiness check
      description: |
        Reports whether the server can handle requests, by checking that the database answers within two
        seconds. The deployment platform uses it as the startup health check. Credentials are ignored.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: The server and its database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable; the error code is `unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /v1/me:
    get:
      tags:
        - Users
      summary: Get the caller
      description: |
        Returns the caller's user. A user is created as a contributor with a default display name on their first
        authenticated request, so this succeeds for any valid credential that is not blocked.
      operationId: getMe
      responses:
        "200":
          description: The caller's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags:
        - Users
      summary: Update the caller
      description: Sets the caller's display name and returns the updated user.
      operationId: updateMe
      requestBody:
        description: The fields to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The caller's updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: |
            The request body is malformed, or the display name is invalid after normalisation; the error code is
            `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid display name: must be at most 64 characters"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Another user's display name has the same key: it differs only in case, accents, spaces or
            punctuation. The error code is `display_name_taken`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: display_name_taken
                message: another user has this display name, or one that differs only in case, spaces or punctuation
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The display name is reserved: it names a role or the site (such as `Moderator`), or has the shape of a
            default display name other than the caller's own. The error code is `display_name_reserved`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: display_name_reserved
                message: this display name is reserved
        "500":
          $ref: "#/components/responses/Internal"

  /v1/users/{user_id}/blocked:
    put:
      tags:
        - Moderation
      summary: Block or unblock a user
      description: |
        Blocks or unblocks a contributor and returns them. A blocked user gets 403 `user_blocked` from every
        authenticated endpoint. Blocking a blocked user, or unblocking one who is not blocked, succeeds again;
        a re-block keeps the time the user was first blocked. Moderators cannot be blocked or unblocked,
        including by themselves. Requires an interactive moderator session: an API token gets 403
        `api_token_not_allowed`.

        Until users can be found through the API, moderators take user IDs from Auth0 or the database.
      operationId: setUserBlocked
      parameters:
        - name: user_id
          in: path
          required: true
          description: |
            The user's `id`, percent-encoded: its `|` is sent as `%7C`, as in `google-oauth2%7C123`.
          schema:
            type: string
            examples:
              - google-oauth2|123
      requestBody:
        description: Whether the user should be blocked.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserBlockedRequest"
            examples:
              block:
                summary: Block the user
                value:
                  blocked: true
              unblock:
                summary: Unblock the user
                value:
                  blocked: false
      responses:
        "200":
          description: The user is now blocked or unblocked, as requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          description: There is no user with this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: user not found
        "409":
          description: The user is a moderator, possibly the caller; the error code is `conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: conflict
                message: moderators cannot be blocked or unblocked
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/moderation/queue:
    get:
      tags:
        - Moderation
      summary: List the moderation queue
      description: |
        Lists one page of the pending revisions, oldest first by when they were submitted, then by `id`, with how
        many match in all. Pending revisions of blocked authors are left out unless `include_blocked` is true.
        Ages are measured from submission, in whole hours, and both bounds are inclusive. Requires an interactive
        moderator session: API tokens get 403 `api_token_not_allowed`.
      operationId: listModerationQueue
      parameters:
        - name: entity_type
          in: query
          required: false
          description: Only list revisions of entities of this type.
          schema:
            $ref: "#/components/schemas/EntityType"
        - name: author
          in: query
          required: false
          description: Only list revisions by the user with this `id`.
          schema:
            type: string
            examples:
              - google-oauth2|123
        - name: min_age_hours
          in: query
          required: false
          description: Only list revisions submitted at least this many hours ago.
          schema:
            type: integer
            minimum: 0
            maximum: 8760
            examples:
              - 24
        - name: max_age_hours
          in: query
          required: false
          description: Only list revisions submitted at most this many hours ago.
          schema:
            type: integer
            minimum: 0
            maximum: 8760
            examples:
              - 168
        - name: include_blocked
          in: query
          required: false
          description: Also list the pending revisions of blocked authors.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of the queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationQueue"
        "400":
          $ref: "#/components/responses/InvalidListRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/moderation/revisions/{revision_id}:
    get:
      tags:
        - Moderation
      summary: Get a revision as a moderator
      description: |
        Returns a revision of any status but draft with every document in full, hidden aliases and hidden links
        included, and what approving it involves: whether it is stale and how it would be rebased, the pending
        new terms and persons approved alongside it, its flags and possible duplicates. Drafts are private to
        their author. Requires an interactive moderator session.
      operationId: getModerationRevision
      parameters:
        - $ref: "#/components/parameters/RevisionID"
      responses:
        "200":
          description: The revision as moderators see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationRevision"
        "400":
          $ref: "#/components/responses/InvalidRevisionID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          $ref: "#/components/responses/ModerationRevisionNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/revisions/{revision_id}/approve:
    post:
      tags:
        - Moderation
      summary: Approve a pending revision
      description: |
        Approves a pending revision and publishes it. A stale revision whose changes merge cleanly with the
        entity's current version is rebased automatically; one that conflicts must be rebased first. The pending
        new terms and persons it references are approved alongside it unless one carries a flag of its own.
        Every flag but `references_pending` must be acknowledged, and a summary holding a hidden name needs a
        replacement `summary`. Requires an interactive moderator session.
      operationId: approveRevision
      parameters:
        - $ref: "#/components/parameters/RevisionID"
      requestBody:
        description: The acknowledged flags, and an optional review note and replacement summary.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: The approved revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationRevision"
        "400":
          $ref: "#/components/responses/InvalidModerationRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          $ref: "#/components/responses/ModerationRevisionNotFound"
        "409":
          description: |
            The approval is refused: the revision is not pending (`not_pending`); it is stale and its changes
            conflict with the current version (`rebase_required`); its entity, or an entity it references, no
            longer exists (`entity_gone`); it carries hidden data a contributor could not see
            (`hidden_data_conflict`); a pending new term or person it references carries flags
            (`pending_reference_flagged`, with that revision's flags); its flags are not acknowledged
            (`unacknowledged_flags`, with the flags); or another term of its facet has taken the term's name
            (`duplicate_name`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FlagsError"
              examples:
                rebaseRequired:
                  summary: The revision conflicts with the current version
                  value:
                    code: rebase_required
                    message: "the entity changed since the base, and the changes conflict: edit the current version"
                unacknowledgedFlags:
                  summary: A flag is not acknowledged
                  value:
                    code: unacknowledged_flags
                    message: the revision has flags that are not acknowledged
                    flags:
                      - code: possible_duplicate
                        path: null
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The document approval would publish is invalid (`invalid_document`, with its problems), or the new
            person matches a person who has asked not to have a page (`duplicate_blocked`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DocumentError"
                  - $ref: "#/components/schemas/Error"
              examples:
                invalidDocument:
                  summary: The document is invalid
                  value:
                    code: invalid_document
                    message: the document is invalid
                    problems:
                      - path: /summary
                        problem: too_long
                duplicateBlocked:
                  summary: The new person matches a person who has asked not to have a page
                  value:
                    code: duplicate_blocked
                    message: a person with this name has asked not to have a page
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WriteUnavailable"

  /v1/revisions/{revision_id}/reject:
    post:
      tags:
        - Moderation
      summary: Reject a pending revision
      description: |
        Rejects a pending revision; a pending new entity no other pending revision has is deleted. The review
        note reaches the author, so a note holding a hidden name must acknowledge `hidden_alias_in_review_note`.
        Requires an interactive moderator session.
      operationId: rejectRevision
      parameters:
        - $ref: "#/components/parameters/RevisionID"
      requestBody:
        description: The acknowledged flags, and an optional review note.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: The rejected revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationRevision"
        "400":
          $ref: "#/components/responses/InvalidModerationRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          $ref: "#/components/responses/ModerationRevisionNotFound"
        "409":
          description: |
            The revision is not pending (`not_pending`), or the review note holds a hidden name that is not
            acknowledged (`unacknowledged_flags`, with the flag).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FlagsError"
              examples:
                notPending:
                  summary: The revision is not pending
                  value:
                    code: not_pending
                    message: the revision is not pending
                unacknowledgedFlags:
                  summary: The review note holds a hidden name
                  value:
                    code: unacknowledged_flags
                    message: the revision has flags that are not acknowledged
                    flags:
                      - code: hidden_alias_in_review_note
                        path: /review_note
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WriteUnavailable"

  /v1/revisions/{revision_id}/rebase:
    post:
      tags:
        - Moderation
      summary: Rebase a pending revision
      description: |
        Replaces a pending revision's document with one the moderator resolved against the entity's current
        revision, which becomes its base. The revision stays pending; what its author submitted, and the base
        they edited from, are kept. The document is validated against the current version with its author's
        rules. Requires an interactive moderator session.
      operationId: rebaseRevision
      parameters:
        - $ref: "#/components/parameters/RevisionID"
      requestBody:
        description: The resolved document, the current revision it was resolved against, and an optional summary.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebaseRequest"
      responses:
        "200":
          description: The rebased revision, still pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationRevision"
        "400":
          description: |
            The `revision_id` is not a positive integer, the request body is malformed, or its document is not a
            document of its `entity_type` or of the revision's; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: field document has an unknown field
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          $ref: "#/components/responses/ModerationRevisionNotFound"
        "409":
          description: |
            The revision is not pending (`not_pending`); `current_revision_id` is no longer the entity's current
            revision (`stale`); or the entity, or an entity the document references, no longer exists
            (`entity_gone`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: stale
                message: "the entity's current revision has changed: resolve against the new current revision"
        "413":
          $ref: "#/components/responses/DocumentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidDocument"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WriteUnavailable"

  /v1/moderation/link-reports:
    get:
      tags:
        - Moderation
      summary: List link reports
      description: |
        Lists one page of the link reports, oldest first, then by `id`, each with its link as it is now and who
        reported it, with how many match in all. Requires an interactive moderator session.
      operationId: listLinkReports
      parameters:
        - name: status
          in: query
          required: false
          description: Only list reports with this status.
          schema:
            $ref: "#/components/schemas/LinkReportStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of link reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkReportList"
        "400":
          $ref: "#/components/responses/InvalidListRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/moderation/link-reports/{report_id}:
    post:
      tags:
        - Moderation
      summary: Resolve a link report
      description: |
        Resolves or dismisses an open link report, optionally hiding its link in the same write; hiding resolves
        the link's other open reports too. Requires an interactive moderator session.
      operationId: resolveLinkReport
      parameters:
        - name: report_id
          in: path
          required: true
          description: The report's `id`.
          schema:
            type: integer
            format: int64
            minimum: 1
            examples:
              - 3
      requestBody:
        description: The resolution.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveLinkReportRequest"
      responses:
        "200":
          description: The resolved report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkReport"
        "400":
          description: |
            The `report_id` is not a positive integer, or the request body is malformed or invalid; the error code
            is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid status: must be resolved or dismissed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          description: There is no report with this `id`; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: link report not found
        "409":
          description: The report is already resolved or dismissed; the error code is `conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: conflict
                message: the link report is not open
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WriteUnavailable"

  /v1/moderation/links:
    get:
      tags:
        - Moderation
      summary: Find a link by URL
      description: |
        Returns the link whose normalized URL is `url`'s, hidden or not, with its `link_id`, every entity it is
        attached to and how many of its reports are open. Requires an interactive moderator session.
      operationId: getModerationLink
      parameters:
        - name: url
          in: query
          required: true
          description: The link's URL, in any spelling that normalizes to the same URL.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
            examples:
              - https://example.org/the-copper-kettle
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationLink"
        "400":
          description: |
            `url` is missing, empty, longer than 2048 characters or given more than once, or the query string is
            not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: query parameter url is required
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/links/{link_id}/hidden:
    put:
      tags:
        - Moderation
      summary: Hide or show a link
      description: |
        Hides a link from every public view (a takedown), or shows it again. Hiding resolves the link's open
        reports with the note "Link hidden.". Requires an interactive moderator session.
      operationId: setLinkHidden
      parameters:
        - name: link_id
          in: path
          required: true
          description: The link's `id`, from a moderator view.
          schema:
            type: integer
            format: int64
            minimum: 1
            examples:
              - 7
      requestBody:
        description: Whether the link should be hidden.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLinkHiddenRequest"
      responses:
        "200":
          description: The link, now hidden or shown as requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationLink"
        "400":
          description: |
            The `link_id` is not a positive integer, or the request body is malformed or invalid; the error code
            is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: hidden is required
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WriteUnavailable"

  /v1/moderation/contact-requests:
    get:
      tags:
        - Moderation
      summary: List contact requests
      description: |
        Lists one page of the contact requests, newest first, then by `id` descending, with how many match in
        all. Each holds its sender's personal data until it is purged, 180 days after resolution; the purge of
        requests past that runs before the list. Requires an interactive moderator session.
      operationId: listContactRequests
      parameters:
        - name: status
          in: query
          required: false
          description: Only list requests with this status.
          schema:
            $ref: "#/components/schemas/ContactRequestStatus"
        - name: kind
          in: query
          required: false
          description: Only list requests of this kind.
          schema:
            $ref: "#/components/schemas/ContactRequestKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of contact requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestList"
        "400":
          $ref: "#/components/responses/InvalidListRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/moderation/contact-requests/{request_id}:
    post:
      tags:
        - Moderation
      summary: Resolve a contact request
      description: |
        Resolves or dismisses an open contact request. Its personal data is purged 180 days later. Requires an
        interactive moderator session.
      operationId: resolveContactRequest
      parameters:
        - name: request_id
          in: path
          required: true
          description: The request's `id`.
          schema:
            type: integer
            format: int64
            minimum: 1
            examples:
              - 12
      requestBody:
        description: The resolution.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveContactRequestRequest"
      responses:
        "200":
          description: The resolved request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequest"
        "400":
          description: |
            The `request_id` is not a positive integer, or the request body is malformed or invalid; the error
            code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid status: must be resolved or dismissed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InteractiveModeratorForbidden"
        "404":
          description: There is no request with this `id`; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: contact request not found
        "409":
          description: The request is already resolved or dismissed; the error code is `conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: conflict
                message: the contact request is not open
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/WriteUnavailable"

  /v1/tokens:
    post:
      tags:
        - API tokens
      summary: Create an API token
      description: |
        Creates a personal API token for the caller and returns its secret, which is shown only in this response.
        A user may have at most 10 active tokens; the limit is checked before the token is stored, so concurrent
        requests can exceed it. Requires Auth0 authentication: API tokens cannot create tokens.
      operationId: createAPIToken
      security:
        - auth0Bearer: []
      requestBody:
        description: The token to create. Send `{}` to create a token without a name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenRequest"
            examples:
              named:
                summary: A named token
                value:
                  name: CI runner
              unnamed:
                summary: A token without a name
                value: {}
      responses:
        "201":
          description: The token was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "409":
          description: The caller already has 10 active tokens; the error code is `token_limit_reached`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: token_limit_reached
                message: user has reached the maximum number of active API tokens
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags:
        - API tokens
      summary: List API tokens
      description: |
        Lists the caller's active (not revoked) API tokens, newest first. Secrets are never included. Requires
        Auth0 authentication: API tokens cannot list tokens.
      operationId: listAPITokens
      security:
        - auth0Bearer: []
      responses:
        "200":
          description: The caller's active tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens/{token_id}:
    delete:
      tags:
        - API tokens
      summary: Revoke an API token
      description: |
        Revokes one of the caller's API tokens, which then no longer authenticates requests. Revoking a token that
        is already revoked succeeds again. Requires Auth0 authentication: API tokens cannot revoke tokens.
      operationId: revokeAPIToken
      security:
        - auth0Bearer: []
      parameters:
        - name: token_id
          in: path
          required: true
          description: |
            The token's `id`: a UUID in canonical form, lowercase and hyphenated. Any other value names no token.
          schema:
            type: string
            examples:
              - 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "404":
          description: |
            The caller has no token with this ID, or the ID is not a canonical UUID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: API token not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/pieces:
    get:
      tags:
        - Catalogue
      summary: Search pieces
      description: |
        Searches the public pieces, returning one page of them with how many match in all and the facet counts.
        Every filter given must match. `term`s are grouped by their facet: a piece matches a facet if it is
        tagged with any of its terms or any of their descendants, and must match every facet given. `kind`,
        `conservation_status` and their values work the same way, as two more facets.

        Facet counts are disjunctive: a value's count is how many pieces match every filter except the values
        selected in its own facet, and match the value (a term with its descendants, each piece counted once).
        Only values with a count above zero are listed. Letter counts ignore the `letter` filter. Unapproved
        pieces, and terms that are unapproved or under an unapproved ancestor, are never matched or counted.
        Credentials are ignored.
      operationId: listPieces
      security: []
      parameters:
        - name: term
          in: query
          required: false
          description: |
            Slugs of public piece terms (any facet but `affiliation`) to filter on; repeat the parameter for
            several. A slug given more than once counts once.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            examples:
              - [war, swords]
            items:
              type: string
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
              maxLength: 191
              examples:
                - war
        - name: kind
          in: query
          required: false
          description: Kinds to filter on, matching a piece's primary or secondary kinds; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            uniqueItems: true
            items:
              $ref: "#/components/schemas/PieceKind"
        - name: conservation_status
          in: query
          required: false
          description: Conservation statuses to filter on; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            uniqueItems: true
            items:
              $ref: "#/components/schemas/ConservationStatus"
        - name: stub
          in: query
          required: false
          description: Only list pieces that are (`true`) or are not (`false`) stubs.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Letter"
        - name: sort
          in: query
          required: false
          description: |
            The order: by sort title, or by `relevance` to `q` (best first, then by sort title). Defaults to
            `relevance` with `q` and `title` without; `relevance` needs `q`. Ties are broken by an internal ID, so
            pages are stable.
          schema:
            $ref: "#/components/schemas/PieceSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of pieces, with the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PieceList"
        "400":
          description: |
            A parameter is invalid: a `term` that is not a slug, more than 20 `term`s, or a slug that no public
            piece term has (the same `unknown term` error whether the term does not exist, is not approved, or is
            an affiliation); a `kind` or `conservation_status` that is not one of its values or is repeated; a
            `stub` that is not `true` or `false`; a `q` that is blank, longer than 200 characters or not valid
            UTF-8; a `letter` that is not A to Z or 0; `sort=relevance` without `q`; `limit` or `offset` out of
            range; a scalar parameter given more than once; or a query string that is not validly
            percent-encoded. The error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownTerm:
                  summary: No public piece term has the slug
                  value:
                    code: invalid_request
                    message: "unknown term: swords"
                invalidKind:
                  summary: A kind that is not a piece kind
                  value:
                    code: invalid_request
                    message: "invalid kind: not one of its allowed values"
        "500":
          $ref: "#/components/responses/InternalSearch"

  /v1/pieces/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a piece
      description: |
        Returns a public piece with everything its page shows: classification, credits, relations, links with
        their recorded performances, and conservation history. References to entities that are not public are
        left out: unapproved terms, collections and events, and credits to and performers who are unapproved or
        prefer not to have a page. Hidden links never appear. An unapproved piece is not found, exactly like an
        unknown one. Credentials are ignored.
      operationId: getPiece
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public piece has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: piece not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/persons:
    get:
      tags:
        - Catalogue
      summary: Search persons
      description: |
        Searches the public persons, returning one page of them with how many match in all and how many sort
        under each letter, ignoring the `letter` filter. Every filter given must match. Persons who prefer not to
        have a page are listed as stubs: `q` matches them by name only, and they match no `role` or
        `affiliation` filter. Hidden aliases never match. Unapproved persons are never listed or counted.
        Credentials are ignored.
      operationId: listPersons
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Kinds to filter on; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            uniqueItems: true
            items:
              $ref: "#/components/schemas/PersonKind"
        - name: role
          in: query
          required: false
          description: Roles to filter on, matching a person with any of them; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              $ref: "#/components/schemas/PersonRole"
        - name: affiliation
          in: query
          required: false
          description: |
            The slug of a public affiliation term, matching persons affiliated with it or any of its
            descendants.
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 191
            examples:
              - northmarch
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Letter"
        - name: sort
          in: query
          required: false
          description: |
            The order: by sort name, or by `relevance` to `q` (best first, then by sort name). Defaults to
            `relevance` with `q` and `name` without; `relevance` needs `q`. Ties are broken by an internal ID, so
            pages are stable.
          schema:
            $ref: "#/components/schemas/PersonSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of persons, with the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "400":
          description: |
            A parameter is invalid: a `kind` or `role` that is not one of its values or is repeated; an
            `affiliation` that is not a slug, or that no public affiliation term has (the same `unknown
            affiliation` error whether the term does not exist, is not approved, or is not an affiliation); a `q`
            that is blank, longer than 200 characters or not valid UTF-8; a `letter` that is not A to Z or 0;
            `sort=relevance` without `q`; `limit` or `offset` out of range; a scalar parameter given more than
            once; or a query string that is not validly percent-encoded. The error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "unknown affiliation: northmarch"
        "500":
          $ref: "#/components/responses/InternalSearch"

  /v1/persons/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a person
      description: |
        Returns a public person. A person who prefers not to have a page is shown by identity only: name, kind,
        status and its source, with `is_stub` true and `profile` null. Otherwise the profile has their public
        aliases (hidden aliases never appear), roles, affiliations, relations to other public persons, links,
        works and performances. Works and performances are capped at 200 each, with totals. An unapproved person
        is not found, exactly like an unknown one. Credentials are ignored.
      operationId: getPerson
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
              examples:
                profile:
                  summary: A person with a page
                  value:
                    slug: wren-of-the-vale
                    name: Wren of the Vale
                    kind: community_bard
                    is_stub: false
                    status: active
                    status_date: null
                    status_source_url: null
                    profile:
                      pronouns: she/her
                      notes_md: A bard of the northern marches.
                      licensing_status: known
                      licensing_notes_md: Happy for her songs to be sung anywhere.
                      aliases:
                        - name: Wren
                          kind: nickname
                      roles:
                        - singer
                        - songwriter
                      affiliations:
                        - slug: northmarch
                          facet: affiliation
                          display_name: Northmarch
                      relations: []
                      links: []
                      works:
                        - piece:
                            slug: the-copper-kettle
                            title: The Copper Kettle
                            kind: song
                            secondary_kinds: []
                            conservation_status: low_risk
                            is_stub: false
                          role: lyrics
                          certainty: certain
                          part: null
                      works_total: 1
                      performances: []
                      performances_total: 0
                noPage:
                  summary: A person who prefers not to have a page
                  value:
                    slug: hollis-fenn
                    name: Hollis Fenn
                    kind: community_bard
                    is_stub: true
                    status: prefers_no_page
                    status_date: "2026-03-01"
                    status_source_url: https://example.org/requests/12
                    profile: null
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public person has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: person not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/terms:
    get:
      tags:
        - Catalogue
      summary: List terms
      description: |
        Lists the public terms of one facet, or of every facet, in tree order: by facet in the order of the
        `Facet` enum, each parent before its children, and siblings by position, then display name. A term
        that is unapproved, or under an unapproved ancestor, is not listed, nor is its subtree. Each term's counts
        are of the distinct public pieces, and public persons with a page, that it or any public descendant
        classifies. Credentials are ignored.
      operationId: listTerms
      security: []
      parameters:
        - name: facet
          in: query
          required: false
          description: Only list terms of this facet. Omitted, terms of every facet are listed.
          schema:
            $ref: "#/components/schemas/Facet"
      responses:
        "200":
          description: The terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermList"
        "400":
          description: |
            The `facet` is not a facet or is given more than once, or the query string is not validly
            percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid facet: not one of its allowed values"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/terms/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a term
      description: |
        Returns a public term with its aliases, ancestors, public children and related affiliation, and one page
        of its members: the public pieces it or any public descendant classifies, or for an `affiliation` term,
        the public persons with a page affiliated with it or any public descendant. The other member list is
        empty. Members are ordered by sort title or sort name; `piece_count` and `person_count` are their totals.
        A term that is unapproved, or under an unapproved ancestor, is not found, exactly like an unknown one.
        Credentials are ignored.
      operationId: getTerm
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          description: |
            The slug is not a valid slug, `limit` or `offset` is out of range or given more than once, or the
            query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidSlug:
                  summary: The slug is not a valid slug
                  value:
                    code: invalid_request
                    message: "invalid slug: must be lowercase ASCII letters and digits, in runs joined by single hyphens, at most 191 characters"
                invalidLimit:
                  summary: The limit is out of range
                  value:
                    code: invalid_request
                    message: "invalid limit: must be an integer from 1 to 100"
        "404":
          description: No public term has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: term not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/collections:
    get:
      tags:
        - Catalogue
      summary: List collections
      description: |
        Lists one page of the public collections, by sort name, with how many match in all and how many sort
        under each letter, ignoring the `letter` filter. Unapproved collections are not listed or counted.
        Credentials are ignored.
      operationId: listCollections
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Collection kinds to filter on; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 13
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CollectionKind"
        - $ref: "#/components/parameters/Letter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of collections, with the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
        "400":
          description: |
            A `kind` is not a collection kind or is repeated, the `letter` is not A to Z or 0, `limit` or
            `offset` is out of range, a scalar parameter is given more than once, or the query string is not
            validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid kind: not one of its allowed values"
        "500":
          $ref: "#/components/responses/InternalSearch"

  /v1/collections/{collection_id}:
    get:
      tags:
        - Catalogue
      summary: Get a collection
      description: |
        Returns a public collection with its public region, parent and children, and its citations: each
        visible link in the collection, once for each public piece, or public person with a page, it is attached
        to, with the roles it is attached with. Citations are ordered by the piece's sort title or the person's
        sort name and capped at 200, with a total. Hidden links never appear. An unapproved collection is not
        found, exactly like an unknown one. Credentials are ignored.
      operationId: getCollection
      security: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: |
            The `collection_id` is not a positive integer in decimal digits; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid collection_id: must be an integer from 1 to 9223372036854775807"
        "404":
          description: No public collection has this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: collection not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events:
    get:
      tags:
        - Catalogue
      summary: List events
      description: |
        Lists one page of the public events and venues, by name, with how many there are in all. Unapproved
        events are not listed. Credentials are ignored.
      operationId: listEvents
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Only list events of this kind. Omitted, both kinds are listed.
          schema:
            $ref: "#/components/schemas/EventKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: |
            The `kind` is not an event kind, `limit` or `offset` is out of range, a parameter is given more than
            once, or the query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid offset: must be an integer from 0 to 10000"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get an event
      description: |
        Returns a public event or venue with the performances recorded at it, newest year first (unknown years
        last), capped at 200, with a total. Performances on hidden links, of unapproved pieces, or recorded only
        by links of entities that are unapproved or prefer not to have a page are left out, as are performers who
