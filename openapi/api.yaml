        - data: []
          total: 0

    RebaseConflict:
      type: object
      description: |
        A field, element or order that a stale revision and the current document both changed, differently,
        since their common base. Each value is the JSON of what the base, the revision and the current document
        hold at `path`, encoded as a string, or null where that side has no such element. Values are in the
        stored document format, which references entities by internal ID. `path` is a field's name (`title`), a
        group's (`licensing`), a keyed list element (`links[https://example.org/a]`) or a list's order
        (`links#order`).
      additionalProperties: false
      required: [path, base_json, revision_json, current_json]
      properties:
        path:
          type: string
          examples:
            - title
        base_json:
          type: [string, "null"]
          examples:
            - '"The Copper Kettle"'
        revision_json:
          type: [string, "null"]
          examples:
            - '"The Copper Kettle (Air)"'
        current_json:
          type: [string, "null"]
          examples:
            - '"Copper Kettle"'
      examples:
        - path: title
          base_json: '"The Copper Kettle"'
          revision_json: '"The Copper Kettle (Air)"'
          current_json: '"Copper Kettle"'

    RebasePreview:
      type: object
      description: |
        What approving the revision would do with its document: for a clean rebase, the merged document it would
        publish; for conflicts, the conflicts a moderator must resolve by rebasing.
      additionalProperties: false
      required: [status, merged_document, conflicts]
      properties:
        status:
