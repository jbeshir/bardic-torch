        - entity
        - title
        - summary
        - source
        - author
        - created_at
        - submitted_at
        - reviewed_at
        - review_note
        - base_revision_id
        - submitted_base_revision_id
        - snapshot
        - base_snapshot
        - changed_fields
        - pending_references
      properties:
        id:
          $ref: "#/components/schemas/MyRevisionSummary/properties/id"
        status:
          $ref: "#/components/schemas/MyRevisionSummary/properties/status"
        entity_type:
          $ref: "#/components/schemas/MyRevisionSummary/properties/entity_type"
        entity:
          $ref: "#/components/schemas/MyRevisionSummary/properties/entity"
        title:
          $ref: "#/components/schemas/MyRevisionSummary/properties/title"
        summary:
          $ref: "#/components/schemas/MyRevisionSummary/properties/summary"
        source:
          $ref: "#/components/schemas/MyRevisionSummary/properties/source"
        author:
          $ref: "#/components/schemas/MyRevisionSummary/properties/author"
        created_at:
          $ref: "#/components/schemas/MyRevisionSummary/properties/created_at"
        submitted_at:
          $ref: "#/components/schemas/MyRevisionSummary/properties/submitted_at"
        reviewed_at:
          $ref: "#/components/schemas/MyRevisionSummary/properties/reviewed_at"
        review_note:
          $ref: "#/components/schemas/MyRevisionSummary/properties/review_note"
        base_revision_id:
          $ref: "#/components/schemas/MyRevisionSummary/properties/base_revision_id"
        submitted_base_revision_id:
          $ref: "#/components/schemas/MyRevisionSummary/properties/submitted_base_revision_id"
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        base_snapshot:
          oneOf:
            - $ref: "#/components/schemas/Snapshot"
            - type: "null"
        changed_fields:
          type: array
          description: The snapshot's top-level fields that differ from the base's, or with no base, that are not empty.
          uniqueItems: true
          items:
            type: string
            examples:
              - description_md
        pending_references:
          type: array
          items:
            $ref: "#/components/schemas/EditorReference"
      examples:
        - id: 51
          status: pending
          entity_type: event
          entity:
            slug: midwinter-revel
            collection_id: null
            is_new: false
          title: Midwinter Revel
          summary: Describe the revel.
          source: user
          author:
            display_name: Morwen
            role: contributor
          created_at: "2026-10-01T09:00:00Z"
          submitted_at: "2026-10-01T09:10:00Z"
          reviewed_at: null
          review_note: null
          base_revision_id: 46
          submitted_base_revision_id: 46
          snapshot:
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.
          base_snapshot:
            name: Midwinter Revel
            kind: event
            description_md: null
          changed_fields: [description_md]
          pending_references: []

    MyRevisionList:
      type: object
      description: |
