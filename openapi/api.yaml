    EditorEntityRef:
      type: object
      description: |
        The entity a revision or draft edits: a piece, person, term or event by `slug`, a collection by
        `collection_id`. `is_new` is true for the caller's own pending new entity, whose slug is a placeholder.
      additionalProperties: false
      required: [slug, collection_id, is_new]
      properties:
        slug:
          type: [string, "null"]
          description: The entity's slug; null for a collection.
          examples:
            - the-copper-kettle
        collection_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The collection's `id`; null for other entities.
          examples:
            - null
        is_new:
          type: boolean
      examples:
        - slug: the-copper-kettle
          collection_id: null
          is_new: false

    EditorReference:
      type: object
      description: |
        An entity a document references, as the caller sees it, with a label to show it by: a public entity's
        title or name, or the name the caller's own pending new term or person has in its pending document.
      additionalProperties: false
      required: [entity_type, slug, collection_id, label, is_pending]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        slug:
          type: [string, "null"]
          description: The entity's slug; null for a collection.
          examples:
            - drinking-songs
        collection_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The collection's `id`; null for other entities.
          examples:
            - null
        label:
          type: string
          examples:
            - Drinking songs
        is_pending:
          type: boolean
          description: True for the caller's own pending new term or person.
      examples:
        - entity_type: term
          slug: drinking-songs
          collection_id: null
          label: Drinking songs
          is_pending: false

    LinkState:
      type: object
      description: |
        The state of one of a document's links, by the document's URL, for a moderator: the existing link's `id`,
        hidden state and liveness, or a null `link_id` and `liveness` for a URL no link has yet.
      additionalProperties: false
      required: [url, link_id, is_hidden, liveness]
      properties:
        url:
          type: string
          examples:
            - https://example.org/the-copper-kettle
        link_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 7
        is_hidden:
          type: boolean
        liveness:
          oneOf:
            - $ref: "#/components/schemas/Liveness"
            - type: "null"
      examples:
        - url: https://example.org/the-copper-kettle
          link_id: 7
          is_hidden: false
          liveness: ok

    Editable:
      type: object
      description: |
        The document the caller starts an edit of an entity from. With `starting_point` `current` it is the
        entity's current document, without what the caller may not see; with `pending` it is the caller's pending
        revision of the entity as they see it, and `base_revision_id` is the base that revision was submitted on,
        so that a new draft keeps it. A draft is saved with this `base_revision_id`.
      additionalProperties: false
      required:
        - entity_type
        - entity
        - base_revision_id
        - starting_point
        - document
        - references
        - link_states
        - draft
        - pending
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity:
          $ref: "#/components/schemas/EditorEntityRef"
        base_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The revision a draft started from this document is based on; null for a pending new entity.
          examples:
            - 41
        starting_point:
          type: string
          enum: [current, pending]
          examples:
            - current
        document:
          $ref: "#/components/schemas/EditorDocument"
        references:
          type: array
          description: The entities the document references, each once.
          items:
            $ref: "#/components/schemas/EditorReference"
        link_states:
          type: array
          description: The states of the document's links, for an interactive moderator; always empty otherwise.
          items:
            $ref: "#/components/schemas/LinkState"
        draft:
          description: The caller's draft of the entity, if they have one.
          oneOf:
            - type: object
              description: A draft, by `id`, with when it was last saved.
              additionalProperties: false
              required: [id, updated_at]
              properties:
                id:
                  $ref: "#/components/schemas/RevisionSummary/properties/id"
                updated_at:
                  type: string
                  format: date-time
                  examples:
                    - "2026-10-01T09:00:00Z"
            - type: "null"
        pending:
          description: The caller's pending revision of the entity, if they have one.
          oneOf:
            - type: object
              description: A pending revision, by `id`, with when it was submitted.
              additionalProperties: false
              required: [id, submitted_at]
              properties:
                id:
                  $ref: "#/components/schemas/RevisionSummary/properties/id"
                submitted_at:
                  type: string
                  format: date-time
                  examples:
                    - "2026-10-01T09:00:00Z"
            - type: "null"
      examples:
        - entity_type: event
          entity:
            slug: midwinter-revel
            collection_id: null
            is_new: false
          base_revision_id: 46
          starting_point: current
          document:
            name: Midwinter Revel
            kind: event
            description_md: null
          references: []
          link_states: []
          draft: null
          pending: null

    DraftEntityKey:
      type: object
      description: The existing entity a draft is of, by `slug`, or a collection by `collection_id`; the other is null.
      additionalProperties: false
      required: [slug, collection_id]
      properties:
        slug:
          oneOf:
            - $ref: "#/components/schemas/EditorSlug"
            - type: "null"
        collection_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - null
      examples:
        - slug: midwinter-revel
          collection_id: null

    CreateDraftRequest:
      type: object
      description: |
        A draft to save: of the entity `entity`, or of a new entity of `entity_type` if it is null, on the base
        `base_revision_id`, the one `Editable` gave, or the entity's current revision if it is null.
      additionalProperties: false
      required: [entity_type, entity, base_revision_id, document, summary]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity:
          oneOf:
            - $ref: "#/components/schemas/DraftEntityKey"
            - type: "null"
        base_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 46
        document:
          $ref: "#/components/schemas/EditorDocument"
        summary:
          $ref: "#/components/schemas/RevisionSummaryText"
      examples:
        - entity_type: event
          entity:
            slug: midwinter-revel
            collection_id: null
          base_revision_id: 46
          document:
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.
          summary: Describe the revel.

    UpdateDraftRequest:
      type: object
      description: A draft's new document and summary; `entity_type` must be the draft's.
      additionalProperties: false
      required: [entity_type, document, summary]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        document:
          $ref: "#/components/schemas/EditorDocument"
        summary:
          $ref: "#/components/schemas/RevisionSummaryText"
      examples:
        - entity_type: event
          document:
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.
          summary: Describe the revel.

    RevisionSummaryText:
      type: string
      description: What the edit changes, in its author's words; may be empty. At most 500 characters.
      maxLength: 500
      examples:
        - Describe the revel.

    DuplicateMatch:
      type: object
      description: An existing entity a new one may duplicate, by `slug` (a collection by `collection_id`).
      additionalProperties: false
      required: [entity_type, slug, collection_id, name, matched]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        slug:
          type: [string, "null"]
          examples:
            - the-copper-kettle
        collection_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - null
        name:
          type: string
          description: The entity's title or name.
          examples:
            - The Copper Kettle
        matched:
          $ref: "#/components/schemas/DuplicateField"
      examples:
        - entity_type: piece
          slug: the-copper-kettle
          collection_id: null
          name: The Copper Kettle
          matched: title

    Draft:
      type: object
      description: |
        A draft as its author saved it. `duplicates` are the entities a new entity's names match (always empty
        for a draft of an existing entity), `references` the entities the document references, and `preview` the
        draft as it would show once approved, or null if it does not convert to a view yet.
      additionalProperties: false
      required:
        - id
        - entity_type
        - entity
        - base_revision_id
        - document
        - summary
        - created_at
        - updated_at
        - duplicates
        - references
        - preview
      properties:
        id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity:
          description: The entity the draft is of; null for a draft of a new entity.
          oneOf:
            - $ref: "#/components/schemas/EditorEntityRef"
            - type: "null"
        base_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The revision the draft is based on; null for a new entity.
          examples:
            - 46
        document:
          $ref: "#/components/schemas/EditorDocument"
        summary:
          $ref: "#/components/schemas/RevisionSummaryText"
        created_at:
          type: string
          format: date-time
          examples:
            - "2026-10-01T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          examples:
            - "2026-10-01T09:05:00Z"
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateMatch"
        references:
          type: array
          items:
            $ref: "#/components/schemas/EditorReference"
        preview:
          oneOf:
            - $ref: "#/components/schemas/Snapshot"
            - type: "null"
      examples:
        - id: 51
          entity_type: event
          entity:
            slug: midwinter-revel
            collection_id: null
            is_new: false
          base_revision_id: 46
          document:
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.
          summary: Describe the revel.
          created_at: "2026-10-01T09:00:00Z"
          updated_at: "2026-10-01T09:05:00Z"
          duplicates: []
          references: []
          preview:
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.

    SubmitRevisionRequest:
      type: object
      description: |
        A submission of the caller's draft. `acknowledge_duplicates` confirms that a new entity duplicates none of
        the entities its draft lists in `duplicates`. `acknowledged_flags` are a moderator's acknowledgements of
        their submission's flags; contributors send `[]`, and API tokens' are ignored.
      additionalProperties: false
      required: [draft_id, acknowledge_duplicates, acknowledged_flags]
      properties:
        draft_id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        acknowledge_duplicates:
          type: boolean
        acknowledged_flags:
          $ref: "#/components/schemas/AcknowledgedFlags"
      examples:
        - draft_id: 51
          acknowledge_duplicates: false
          acknowledged_flags: []

    AcknowledgedFlags:
      type: array
      description: The flags a moderator acknowledges, each once; ignored for contributors and API tokens.
      uniqueItems: true
      items:
        $ref: "#/components/schemas/FlagCode"
      examples:
        - []

    RevertRequest:
      type: object
      description: |
        A revert to an approved revision, with a summary, which a conservation status change needs as its reason.
        Without one the revision's summary is `Revert to revision <id>.`.
      additionalProperties: false
      required: [summary, acknowledged_flags]
      properties:
        summary:
          oneOf:
            - $ref: "#/components/schemas/RevisionSummaryText"
            - type: "null"
        acknowledged_flags:
          $ref: "#/components/schemas/AcknowledgedFlags"
      examples:
        - summary: Restore the credit.
          acknowledged_flags: []

