            - type: "null"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/RebaseConflict"
      examples:
        - status: not_needed
          merged_document: null
          conflicts: []

    ModerationPendingReference:
      type: object
      description: |
        A pending new term or person of the revision's author that its document references. Approving the
        revision approves it alongside, unless it carries a flag of its own.
      additionalProperties: false
      required: [revision_id, entity_type, entity, document, flags]
      properties:
        revision_id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        entity_type:
          type: string
          enum: [term, person]
          examples:
            - term
        entity:
          $ref: "#/components/schemas/EditorEntityRef"
        document:
          $ref: "#/components/schemas/EditorDocument"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"
      examples:
        - revision_id: 50
          entity_type: term
          entity:
            slug: pending-term-12
            collection_id: null
            is_new: true
          document:
            facet: topic
            name: Drinking songs
            display_name: Drinking songs
            parent: null
            related_affiliation: null
            description_md: null
            position: 0
            aliases: []
          flags: []

    ModerationRevision:
      type: object
      description: |
        A revision as a moderator sees it: every document in full, hidden aliases and hidden links included,
        in the editor format with references by slug. `author` is null for an imported revision, whose wiki
        contributors are `contributors`. `document` is the revision's document now, and `submitted_document`
        what its author submitted (null for an imported revision), on `submitted_base_revision_id`;
        `base_document` and `current_document` are the documents of its base and of the entity's current
        revision (null for none). `stale`, `rebase`, `pending_references` and `duplicates` describe approving a
        pending revision; `flags` are the flags approving it gates on, or for another status the flags stored on
        it. `changed_paths` are what `document` changes from `base_document`, or from an empty document for a new
        entity, named as a `RebaseConflict`'s `path` is. `link_states` are the states of `document`'s links by URL.
      additionalProperties: false
      required:
        - id
        - status
        - entity_type
        - entity
        - source
        - author
        - contributors
        - reviewer
        - summary
        - review_note
        - created_at
        - submitted_at
        - reviewed_at
        - rebased_at
        - base_revision_id
        - submitted_base_revision_id
        - current_revision_id
        - stale
        - document
        - submitted_document
        - base_document
        - current_document
        - references
        - link_states
        - rebase
        - pending_references
        - flags
        - duplicates
        - changed_paths
