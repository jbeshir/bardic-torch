              schema:
                $ref: "#/components/schemas/Editable"
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No piece the caller may edit has this address; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
