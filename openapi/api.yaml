    ApproveRequest:
      type: object
      description: |
        The body of an approval. `acknowledged_flags` is required, possibly empty, so that a moderator always
        states what they acknowledge. `summary` replaces the revision's summary when it is published, and is
        needed when that summary holds a hidden name. `review_note` reaches the author.
