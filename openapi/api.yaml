        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity:
          oneOf:
            - $ref: "#/components/schemas/EditorEntityRef"
            - type: "null"
        source:
          $ref: "#/components/schemas/RevisionSource"
        author:
          oneOf:
            - $ref: "#/components/schemas/ModerationAuthor"
            - type: "null"
        contributors:
          type: array
