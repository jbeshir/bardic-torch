        review_note:
          type: [string, "null"]
          maxLength: 2000
          examples:
            - "Thanks: approved."
        summary:
          type: [string, "null"]
          maxLength: 500
          examples:
            - null
        acknowledged_flags:
          $ref: "#/components/schemas/AcknowledgedFlags"
      examples:
        - review_note: null
          summary: null
          acknowledged_flags: []

    RejectRequest:
      type: object
      description: |
