            - $ref: "#/components/schemas/EditorDocument"
            - type: "null"
        current_document:
          oneOf:
            - $ref: "#/components/schemas/EditorDocument"
            - type: "null"
        references:
          type: array
          items:
            $ref: "#/components/schemas/EditorReference"
        link_states:
          type: array
