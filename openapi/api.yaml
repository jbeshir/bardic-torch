openapi: 3.1.0
info:
  title: Bardic Torch API
  description: |
    API behind bardictorch.org.

    Conventions:
    - Request and response bodies are JSON (`application/json`); property names are snake_case.
    - Response objects are closed (`additionalProperties: false`): clients can rely on receiving exactly the
      documented properties.
    - Errors use the `Error` body, whose `code` is stable and machine-readable; `message` is for humans.
    - A path no operation matches gets 404 `not_found`; a known path with an unsupported method gets 405
      `method_not_allowed` with an `Allow` header listing the supported methods. Neither authenticates the
      request.
    - Request headers over 16 KiB get a plain-text 431 from the server, before any operation runs.
    - A request whose path is not validly percent-encoded gets a plain-text 400 from the server, before any
      operation runs.
    - operationIds are camelCase.
  version: 1.0.0
  contact:
    name: Bardic Torch
    url: https://bardictorch.org
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.bardictorch.org
    description: Production server

security:
  - auth0Bearer: []
  - apiTokenBearer: []

tags:
  - name: Health
    description: Liveness and readiness checks for the deployment platform
  - name: Users
    description: The caller's account
  - name: Moderation
    description: Actions reserved for moderators
  - name: API tokens
    description: Personal API tokens for programmatic access
  - name: Catalogue
    description: |
      Public reads of the catalogue: pieces, persons, the terms that classify them, and the collections and
      events that record them

paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness check
      description: |
        Reports that the process is serving requests. Always 200 while the server runs; it does not check
        dependencies. Credentials are ignored.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags:
        - Health
      summary: Readiness check
      description: |
        Reports whether the server can handle requests, by checking that the database answers within two
        seconds. The deployment platform uses it as the startup health check. Credentials are ignored.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: The server and its database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable; the error code is `unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /v1/me:
    get:
      tags:
        - Users
      summary: Get the caller
      description: |
        Returns the caller's user. A user is created as a contributor with a default display name on their first
        authenticated request, so this succeeds for any valid credential that is not blocked.
      operationId: getMe
      responses:
        "200":
          description: The caller's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags:
        - Users
      summary: Update the caller
      description: Sets the caller's display name and returns the updated user.
      operationId: updateMe
      requestBody:
        description: The fields to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The caller's updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: |
            The request body is malformed, or the display name is invalid after normalisation; the error code is
            `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid display name: must be at most 64 characters"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/users/{user_id}/blocked:
    put:
      tags:
        - Moderation
      summary: Block or unblock a user
      description: |
        Blocks or unblocks a contributor and returns them. A blocked user gets 403 `user_blocked` from every
        authenticated endpoint. Blocking a blocked user, or unblocking one who is not blocked, succeeds again;
        a re-block keeps the time the user was first blocked. Moderators cannot be blocked or unblocked,
        including by themselves. Requires the moderator role.

        Until users can be found through the API, moderators take user IDs from Auth0 or the database.
      operationId: setUserBlocked
      parameters:
        - name: user_id
          in: path
          required: true
          description: |
            The user's `id`, percent-encoded: its `|` is sent as `%7C`, as in `google-oauth2%7C123`.
          schema:
            type: string
            examples:
              - google-oauth2|123
      requestBody:
        description: Whether the user should be blocked.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserBlockedRequest"
            examples:
              block:
                summary: Block the user
                value:
                  blocked: true
              unblock:
                summary: Unblock the user
                value:
                  blocked: false
      responses:
        "200":
          description: The user is now blocked or unblocked, as requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ModeratorForbidden"
        "404":
          description: There is no user with this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: user not found
        "409":
          description: The user is a moderator, possibly the caller; the error code is `conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: conflict
                message: moderators cannot be blocked or unblocked
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens:
    post:
      tags:
        - API tokens
      summary: Create an API token
      description: |
        Creates a personal API token for the caller and returns its secret, which is shown only in this response.
        A user may have at most 10 active tokens; the limit is checked before the token is stored, so concurrent
        requests can exceed it. Requires Auth0 authentication: API tokens cannot create tokens.
      operationId: createAPIToken
      security:
        - auth0Bearer: []
      requestBody:
        description: The token to create. Send `{}` to create a token without a name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenRequest"
            examples:
              named:
                summary: A named token
                value:
                  name: CI runner
              unnamed:
                summary: A token without a name
                value: {}
      responses:
        "201":
          description: The token was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "409":
          description: The caller already has 10 active tokens; the error code is `token_limit_reached`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: token_limit_reached
                message: user has reached the maximum number of active API tokens
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags:
        - API tokens
      summary: List API tokens
      description: |
        Lists the caller's active (not revoked) API tokens, newest first. Secrets are never included. Requires
        Auth0 authentication: API tokens cannot list tokens.
      operationId: listAPITokens
      security:
        - auth0Bearer: []
      responses:
        "200":
          description: The caller's active tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens/{token_id}:
    delete:
      tags:
        - API tokens
      summary: Revoke an API token
      description: |
        Revokes one of the caller's API tokens, which then no longer authenticates requests. Revoking a token that
        is already revoked succeeds again. Requires Auth0 authentication: API tokens cannot revoke tokens.
      operationId: revokeAPIToken
      security:
        - auth0Bearer: []
      parameters:
        - name: token_id
          in: path
          required: true
          description: |
            The token's `id`: a UUID in canonical form, lowercase and hyphenated. Any other value names no token.
          schema:
            type: string
            examples:
              - 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "404":
          description: |
            The caller has no token with this ID, or the ID is not a canonical UUID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: API token not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/pieces/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a piece
      description: |
        Returns a public piece with everything its page shows: classification, credits, relations, links with
        their recorded performances, and conservation history. References to entities that are not public are
        left out: unapproved terms, collections and events, and credits to and performers who are unapproved or
        prefer not to have a page. Hidden links never appear. An unapproved piece is not found, exactly like an
        unknown one. Credentials are ignored.
      operationId: getPiece
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public piece has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: piece not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/persons/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a person
      description: |
        Returns a public person. A person who prefers not to have a page is shown by identity only: name, kind,
        status and its source, with `is_stub` true and `profile` null. Otherwise the profile has their public
        aliases (hidden aliases never appear), roles, affiliations, relations to other public persons, links,
        works and performances. Works and performances are capped at 200 each, with totals. An unapproved person
        is not found, exactly like an unknown one. Credentials are ignored.
      operationId: getPerson
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
              examples:
                profile:
                  summary: A person with a page
                  value:
                    slug: wren-of-the-vale
                    name: Wren of the Vale
                    kind: community_bard
                    is_stub: false
                    status: active
                    status_date: null
                    status_source_url: null
                    profile:
                      pronouns: she/her
                      notes_md: A bard of the northern marches.
                      licensing_status: known
                      licensing_notes_md: Happy for her songs to be sung anywhere.
                      aliases:
                        - name: Wren
                          kind: nickname
                      roles:
                        - singer
                        - songwriter
                      affiliations:
                        - slug: northmarch
                          facet: affiliation
                          display_name: Northmarch
                      relations: []
                      links: []
                      works:
                        - piece:
                            slug: the-copper-kettle
                            title: The Copper Kettle
                            kind: song
                            secondary_kinds: []
                            conservation_status: low_risk
                            is_stub: false
                          role: lyrics
                          certainty: certain
                          part: null
                      works_total: 1
                      performances: []
                      performances_total: 0
                noPage:
                  summary: A person who prefers not to have a page
                  value:
                    slug: hollis-fenn
                    name: Hollis Fenn
                    kind: community_bard
                    is_stub: true
                    status: prefers_no_page
                    status_date: "2026-03-01"
                    status_source_url: https://example.org/requests/12
                    profile: null
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public person has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: person not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/terms:
    get:
      tags:
        - Catalogue
      summary: List terms
      description: |
        Lists the public terms of one facet, or of every facet, in tree order: by facet in the order of the
        `Facet` enum, each parent before its children, and siblings by position, then display name. A term
        that is unapproved, or under an unapproved ancestor, is not listed, nor is its subtree. Each term's counts
        are of the distinct public pieces, and public persons with a page, that it or any public descendant
        classifies. Credentials are ignored.
      operationId: listTerms
      security: []
      parameters:
        - name: facet
          in: query
          required: false
          description: Only list terms of this facet. Omitted, terms of every facet are listed.
          schema:
            $ref: "#/components/schemas/Facet"
      responses:
        "200":
          description: The terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermList"
        "400":
          description: |
            The `facet` is not a facet or is given more than once, or the query string is not validly
            percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid facet: not one of its allowed values"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/terms/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a term
      description: |
        Returns a public term with its aliases, ancestors, public children and related affiliation, and one page
        of its members: the public pieces it or any public descendant classifies, or for an `affiliation` term,
        the public persons with a page affiliated with it or any public descendant. The other member list is
        empty. Members are ordered by sort title or sort name; `piece_count` and `person_count` are their totals.
        A term that is unapproved, or under an unapproved ancestor, is not found, exactly like an unknown one.
        Credentials are ignored.
      operationId: getTerm
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          description: |
            The slug is not a valid slug, `limit` or `offset` is out of range or given more than once, or the
            query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidSlug:
                  summary: The slug is not a valid slug
                  value:
                    code: invalid_request
                    message: "invalid slug: must be lowercase ASCII letters and digits, in runs joined by single hyphens, at most 191 characters"
                invalidLimit:
                  summary: The limit is out of range
                  value:
                    code: invalid_request
                    message: "invalid limit: must be an integer from 1 to 100"
        "404":
          description: No public term has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: term not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/collections/{collection_id}:
    get:
      tags:
        - Catalogue
      summary: Get a collection
      description: |
        Returns a public collection with its public region, parent and children, and its citations: each
        visible link in the collection, once for each public piece, or public person with a page, it is attached
        to, with the roles it is attached with. Citations are ordered by the piece's sort title or the person's
        sort name and capped at 200, with a total. Hidden links never appear. An unapproved collection is not
        found, exactly like an unknown one. Credentials are ignored.
      operationId: getCollection
      security: []
      parameters:
        - name: collection_id
          in: path
          required: true
          description: The collection's `id`.
          schema:
            type: integer
            format: int64
            minimum: 1
            examples:
              - 12
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: |
            The `collection_id` is not a positive integer in decimal digits; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid collection_id: must be an integer from 1 to 9223372036854775807"
        "404":
          description: No public collection has this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: collection not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events:
    get:
      tags:
        - Catalogue
      summary: List events
      description: |
        Lists one page of the public events and venues, by name, with how many there are in all. Unapproved
        events are not listed. Credentials are ignored.
      operationId: listEvents
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Only list events of this kind. Omitted, both kinds are listed.
          schema:
            $ref: "#/components/schemas/EventKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: |
            The `kind` is not an event kind, `limit` or `offset` is out of range, a parameter is given more than
            once, or the query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid offset: must be an integer from 0 to 10000"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get an event
      description: |
        Returns a public event or venue with the performances recorded at it, newest year first (unknown years
        last), capped at 200, with a total. Performances on hidden links, of unapproved pieces, or recorded only
        by links of entities that are unapproved or prefer not to have a page are left out, as are performers who
        are unapproved or prefer not to have a page. An unapproved event is not found, exactly like an unknown
        one. Credentials are ignored.
      operationId: getEvent
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public event has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: event not found
        "500":
          $ref: "#/components/responses/Internal"


components:
  securitySchemes:
    auth0Bearer:
      type: http
      scheme: bearer
      description: |
        An Auth0 access token for this API, prefixed with `auth0|`: `Authorization: Bearer auth0|<jwt>`.
    apiTokenBearer:
      type: http
      scheme: bearer
      description: |
        A personal API token, prefixed with `user_api|`: `Authorization: Bearer user_api|<token>`.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: |
        The entity's slug: runs of lowercase ASCII letters and digits joined by single hyphens, at most 191
        characters.
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 191
        examples:
          - the-copper-kettle
    Limit:
      name: limit
      in: query
      required: false
      description: The most items to return, from 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
        examples:
          - 50
    Offset:
      name: offset
      in: query
      required: false
      description: How many items to skip, from 0 to 10000.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
        examples:
          - 0

  responses:
    InvalidRequest:
      description: |
        The request body is malformed or invalid; the error code is `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_request
            message: request body has an unknown field
    InvalidSlug:
      description: |
        The slug is not a valid slug; the error code is `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_request
            message: "invalid slug: must be lowercase ASCII letters and digits, in runs joined by single hyphens, at most 191 characters"
    Unauthenticated:
      description: |
        The request has no recognised credentials, or its credentials are invalid, expired or revoked; the error
        code is `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: invalid credentials
    Forbidden:
      description: The caller is blocked; the error code is `user_blocked`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: user_blocked
            message: user is blocked
    ModeratorForbidden:
      description: |
        The caller is blocked (`user_blocked`), or is not a moderator (`moderator_required`). Blocking takes
        precedence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            userBlocked:
              summary: The caller is blocked
              value:
                code: user_blocked
                message: user is blocked
            moderatorRequired:
              summary: The caller is not a moderator
              value:
                code: moderator_required
                message: this endpoint requires the moderator role
    APITokenForbidden:
      description: |
        The caller is blocked (`user_blocked`), or authenticated with an API token, which this endpoint does not
        accept (`api_token_not_allowed`). Blocking takes precedence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            userBlocked:
              summary: The caller is blocked
              value:
                code: user_blocked
                message: user is blocked
            apiTokenNotAllowed:
              summary: The caller used an API token
              value:
                code: api_token_not_allowed
                message: this endpoint cannot be used with an API token
    RequestTooLarge:
      description: The request body is larger than 16 KiB; the error code is `request_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: request_too_large
            message: request body is too large
    UnsupportedMediaType:
      description: The request body is not sent as `application/json`; the error code is `unsupported_media_type`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unsupported_media_type
            message: request body must be sent as application/json
    Internal:
      description: The server failed to handle the request; the error code is `internal`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal
            message: internal error

  schemas:
    Error:
      type: object
      description: The body of every error response.
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - invalid_request
            - unsupported_media_type
            - request_too_large
            - unauthenticated
            - user_blocked
            - api_token_not_allowed
            - moderator_required
            - not_found
            - method_not_allowed
            - conflict
            - token_limit_reached
            - internal
            - unavailable
          examples:
            - unavailable
        message:
          type: string
          description: Human-readable description of the error. Not intended for display to end users.
          examples:
            - database unavailable
      examples:
        - code: unavailable
          message: database unavailable

    HealthStatus:
      type: object
      description: The body of a successful health check.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          examples:
            - ok
      examples:
        - status: ok

    User:
      type: object
      description: A user.
      additionalProperties: false
      required:
        - id
        - display_name
        - role
      properties:
        id:
          type: string
          description: |
            The user's ID: the subject Auth0 authenticated them as, such as `google-oauth2|<id>`. It contains `|`,
            which must be percent-encoded as `%7C` in a path.
          examples:
            - google-oauth2|123
        display_name:
          type: string
          description: The name shown for the user.
          minLength: 1
          maxLength: 64
          examples:
            - Morwen
        role:
          type: string
          description: |
            What the user may do. Every user starts as a `contributor`; `moderator`s may also block and unblock
            contributors.
          enum:
            - contributor
            - moderator
          examples:
            - contributor
      examples:
        - id: google-oauth2|123
          display_name: Morwen
          role: contributor

    UpdateMeRequest:
      type: object
      description: The body of a request to update the caller.
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          description: |
            The new display name, at most 256 characters as sent. It is normalised to Unicode NFC and surrounding
            whitespace is trimmed; the result must have 1 to 64 characters, each a letter, mark, number,
            punctuation, symbol or space separator. So control and format characters (such as U+202E), line and
            paragraph separators, and private-use and unassigned code points are rejected, as are more than 4
            combining marks in a row.
          maxLength: 256
          examples:
            - Morwen
      examples:
        - display_name: Morwen

    SetUserBlockedRequest:
      type: object
      description: The body of a request to block or unblock a user.
      additionalProperties: false
      required:
        - blocked
      properties:
        blocked:
          type: boolean
          description: True to block the user, false to unblock them.
          examples:
            - true
      examples:
        - blocked: true

    CreateAPITokenRequest:
      type: object
      description: The body of a request to create an API token.
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          description: |
            A label to tell the token apart from others. Surrounding whitespace is trimmed, and at most 128
            characters may remain; an empty, whitespace-only, null or missing name means the token has none. The
            characters allowed are those allowed in a display name.
          examples:
            - CI runner
      examples:
        - name: CI runner

    APIToken:
      type: object
      description: An API token. Its secret is never returned after creation.
      additionalProperties: false
      required:
        - id
        - prefix
        - name
        - created_at
        - last_used_at
      properties:
        id:
          type: string
          description: The token's ID, used to revoke it.
          examples:
            - 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
        prefix:
          type: string
          description: The first eight characters of the secret after `user_api|`, to tell tokens apart.
          pattern: "^[0-9a-f]{8}$"
          examples:
            - 0123abcd
        name:
          type:
            - string
            - "null"
          description: The token's label, or null if it has none.
          minLength: 1
          maxLength: 128
          examples:
            - CI runner
        created_at:
          type: string
          format: date-time
          description: When the token was created.
          examples:
            - "2026-10-31T12:00:00Z"
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            When the token last authenticated a request, or null if it never has. Recorded to the nearest minute:
            uses within a minute of the recorded one do not update it.
          examples:
            - "2026-10-31T12:30:00Z"
      examples:
        - id: 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
          prefix: 0123abcd
          name: CI runner
          created_at: "2026-10-31T12:00:00Z"
          last_used_at: "2026-10-31T12:30:00Z"

    CreatedAPIToken:
      type: object
      description: A newly created API token, with its secret.
      additionalProperties: false
      required:
        - id
        - prefix
        - name
        - created_at
        - last_used_at
        - token
      properties:
        id:
          $ref: "#/components/schemas/APIToken/properties/id"
        prefix:
          $ref: "#/components/schemas/APIToken/properties/prefix"
        name:
          $ref: "#/components/schemas/APIToken/properties/name"
        created_at:
          $ref: "#/components/schemas/APIToken/properties/created_at"
        last_used_at:
          $ref: "#/components/schemas/APIToken/properties/last_used_at"
        token:
          type: string
          description: |
            The secret, shown only in this response. Send it as `Authorization: Bearer <token>`.
          pattern: "^user_api\\|[0-9a-f]{64}$"
          examples:
            - "user_api|0123abcd0123abcd0123abcd0123abcd0123abcd0123abcd0123abcd0123abcd"
      examples:
        - id: 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
          prefix: 0123abcd
          name: CI runner
          created_at: "2026-10-31T12:00:00Z"
          last_used_at: null
          token: "user_api|0123abcd0123abcd0123abcd0123abcd0123abcd0123abcd0123abcd0123abcd"

    APITokenList:
      type: object
      description: A list of API tokens.
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
      examples:
        - data:
            - id: 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
              prefix: 0123abcd
              name: CI runner
              created_at: "2026-10-31T12:00:00Z"
              last_used_at: "2026-10-31T12:30:00Z"

    PieceSummary:
      type: object
      description: A public piece, as other entities refer to it.
      additionalProperties: false
      required: [slug, title, kind, secondary_kinds, conservation_status, is_stub]
      properties:
        slug:
          type: string
          description: The piece's address.
          examples:
            - the-copper-kettle
        title:
          type: string
          examples:
            - The Copper Kettle
        kind:
          $ref: "#/components/schemas/PieceKind"
        secondary_kinds:
          type: array
          description: Further kinds the piece also is, in the enum's order.
          items:
            $ref: "#/components/schemas/PieceKind"
        conservation_status:
          $ref: "#/components/schemas/ConservationStatus"
        is_stub:
          type: boolean
          description: Whether the piece's page is only a stub that needs filling in.
          examples:
            - false
      examples:
        - slug: the-copper-kettle
          title: The Copper Kettle
          kind: song
          secondary_kinds: [dance_music]
          conservation_status: endangered
          is_stub: false

    PersonSummary:
      type: object
      description: |
        A public person, as other entities refer to them. Persons who prefer not to have a page are never
        referred to; where they are listed, `is_stub` is true.
      additionalProperties: false
      required: [slug, name, kind, is_stub]
      properties:
        slug:
          type: string
          description: The person's address.
          examples:
            - wren-of-the-vale
        name:
          type: string
          examples:
            - Wren of the Vale
        kind:
          $ref: "#/components/schemas/PersonKind"
        is_stub:
          type: boolean
          description: Whether the person's page is only a stub.
          examples:
            - false
      examples:
        - slug: wren-of-the-vale
          name: Wren of the Vale
          kind: community_bard
          is_stub: false

    TermSummary:
      type: object
      description: A public term, as other entities refer to it.
      additionalProperties: false
      required: [slug, facet, display_name]
      properties:
        slug:
          type: string
          description: The term's address.
          examples:
            - war
        facet:
          $ref: "#/components/schemas/Facet"
        display_name:
          type: string
          description: The term's name, without any disambiguation suffix.
          examples:
            - War
      examples:
        - slug: war
          facet: topic
          display_name: War

    CollectionRef:
      type: object
      description: A public collection, as other entities refer to it. Collections are addressed by ID.
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          examples:
            - 12
        name:
          type: string
          examples:
            - The Northmarch Songbook
      examples:
        - id: 12
          name: The Northmarch Songbook

    EventSummary:
      type: object
      description: A public event or venue, as other entities refer to it.
      additionalProperties: false
      required: [slug, name, kind]
      properties:
        slug:
          type: string
          description: The event's address.
          examples:
            - midwinter-revel
        name:
          type: string
          examples:
            - Midwinter Revel
        kind:
          $ref: "#/components/schemas/EventKind"
      examples:
        - slug: midwinter-revel
          name: Midwinter Revel
          kind: event

    Piece:
      type: object
      description: A public piece's page.
      additionalProperties: false
      required:
        - slug
        - title
        - kind
        - secondary_kinds
        - conservation_status
        - is_stub
        - notes_md
        - version_notes_md
        - licensing_status
        - licensing_notes_md
        - licence
        - historical_source_md
        - period_start
        - period_end
        - aliases
        - terms
        - credits
        - relations
        - links
        - conservation_history
      properties:
        slug:
          $ref: "#/components/schemas/PieceSummary/properties/slug"
        title:
          $ref: "#/components/schemas/PieceSummary/properties/title"
        kind:
          $ref: "#/components/schemas/PieceKind"
        secondary_kinds:
          $ref: "#/components/schemas/PieceSummary/properties/secondary_kinds"
        conservation_status:
          $ref: "#/components/schemas/ConservationStatus"
        is_stub:
          $ref: "#/components/schemas/PieceSummary/properties/is_stub"
        notes_md:
          type: [string, "null"]
          description: Notes about the piece, in Markdown.
          examples:
            - A drinking song from the northern marches.
        version_notes_md:
          type: [string, "null"]
          description: Notes on the piece's versions, in Markdown.
          examples:
            - The second verse is often left out.
        licensing_status:
          $ref: "#/components/schemas/LicensingStatus"
        licensing_notes_md:
          type: [string, "null"]
          description: Notes on the piece's licensing, in Markdown.
          examples:
            - Free to perform with credit.
        licence:
          oneOf:
            - $ref: "#/components/schemas/Licence"
            - type: "null"
        historical_source_md:
          type: [string, "null"]
          description: The historical source of the piece, in Markdown.
          examples:
            - A broadside of about 1590.
        period_start:
          type: [integer, "null"]
          description: The first year of the period the piece dates from.
          examples:
            - 1580
        period_end:
          type: [integer, "null"]
          description: The last year of the period the piece dates from.
          examples:
            - 1600
        aliases:
          type: array
          description: Other titles of the piece.
          items:
            $ref: "#/components/schemas/PieceAlias"
        terms:
          type: array
          description: The public terms the piece is classified with, by facet in the enum's order, then position.
          items:
            $ref: "#/components/schemas/PieceTerm"
        credits:
          type: array
          description: |
            The piece's credits, in order. A credit to a person who is not public or prefers not to have a page is
            left out entirely.
          items:
            $ref: "#/components/schemas/PieceCredit"
        relations:
          type: array
          description: |
            Relations to other public pieces: the outgoing ones, then the incoming ones, each by type and title.
          items:
            $ref: "#/components/schemas/PieceRelation"
        links:
          type: array
          description: |
            The piece's visible links, each once with all its roles, in order. The list is not capped: links are
            curated per piece.
          items:
            $ref: "#/components/schemas/PieceLink"
        conservation_history:
          type: array
          description: The piece's conservation status changes, oldest first.
          items:
            $ref: "#/components/schemas/ConservationChange"
      examples:
        - slug: the-copper-kettle
          title: The Copper Kettle
          kind: song
          secondary_kinds: []
          conservation_status: endangered
          is_stub: false
          notes_md: A drinking song from the northern marches.
          version_notes_md: null
          licensing_status: known
          licensing_notes_md: Free to perform with credit.
          licence: cc_by_sa
          historical_source_md: null
          period_start: null
          period_end: null
          aliases:
            - text: Kettle Song
              kind: nickname
          terms:
            - term:
                slug: drinking
                facet: topic
                display_name: Drinking
              is_primary: true
              part: null
          credits:
            - role: lyrics
              attribution: named
              certainty: certain
              part: null
              note: null
              person:
                slug: wren-of-the-vale
                name: Wren of the Vale
                kind: community_bard
                is_stub: false
            - role: tune
              attribution: traditional
              certainty: probable
              part: null
              note: An old reel.
              person: null
          relations: []
          links:
            - url: https://video.example.org/watch/kettle
              title: The Copper Kettle at Midwinter Revel
              description: null
              platform: video.example.org
              place_type: recording_platform
              collection: null
              locator: null
              liveness: ok
              last_checked_at: "2026-10-01T09:00:00Z"
              archived_url: null
              roles: [performance]
              performances:
                - year: 2025
                  uploader: Northmarch Bards
                  description_verbatim: Sung by Wren at Midwinter Revel 2025
                  event:
                    slug: midwinter-revel
                    name: Midwinter Revel
                    kind: event
                  performers:
                    - slug: wren-of-the-vale
                      name: Wren of the Vale
                      kind: community_bard
                      is_stub: false
          conservation_history:
            - conservation_status: endangered
              reason: Known to only a few singers.
              source_url: null
              at: "2026-01-01T00:00:00Z"

    PieceAlias:
      type: object
      description: Another title of a piece.
      additionalProperties: false
      required: [text, kind]
      properties:
        text:
          type: string
          examples:
            - Kettle Song
        kind:
          $ref: "#/components/schemas/PieceAliasKind"
      examples:
        - text: Kettle Song
          kind: nickname

    PieceTerm:
      type: object
      description: A term a piece is classified with.
      additionalProperties: false
      required: [term, is_primary, part]
      properties:
        term:
          $ref: "#/components/schemas/TermSummary"
        is_primary:
          type: boolean
          description: Whether this is the piece's primary term in its facet.
          examples:
            - true
        part:
          description: The part of the piece the term applies to, or null for the whole piece.
          oneOf:
            - $ref: "#/components/schemas/PiecePart"
            - type: "null"
      examples:
        - term:
            slug: drinking
            facet: topic
            display_name: Drinking
          is_primary: true
          part: null

    PieceCredit:
      type: object
      description: A credit of a piece. `person` is set exactly when `attribution` is `named`.
      additionalProperties: false
      required: [role, attribution, certainty, part, note, person]
      properties:
        role:
          $ref: "#/components/schemas/CreditRole"
        attribution:
          $ref: "#/components/schemas/Attribution"
        certainty:
          $ref: "#/components/schemas/Certainty"
        part:
          description: The part of the piece credited, or null for the whole of the role.
          oneOf:
            - $ref: "#/components/schemas/PiecePart"
            - type: "null"
        note:
          type: [string, "null"]
          description: A note on the credit.
          examples:
            - Words adapted from an older ballad.
        person:
          description: The person credited, for a named credit.
          oneOf:
            - $ref: "#/components/schemas/PersonSummary"
            - type: "null"
      examples:
        - role: lyrics
          attribution: named
          certainty: certain
          part: null
          note: null
          person:
            slug: wren-of-the-vale
            name: Wren of the Vale
            kind: community_bard
            is_stub: false

    PieceRelation:
      type: object
      description: A relation between the piece shown and another public piece.
      additionalProperties: false
      required: [type, direction, piece]
      properties:
        type:
          $ref: "#/components/schemas/PieceRelationType"
        direction:
          $ref: "#/components/schemas/RelationDirection"
        piece:
          $ref: "#/components/schemas/PieceSummary"
      examples:
        - type: variant_of
          direction: outgoing
          piece:
            slug: the-brass-kettle
            title: The Brass Kettle
            kind: song
            secondary_kinds: []
            conservation_status: low_risk
            is_stub: false

    PersonLink:
      type: object
      description: A visible link attached to a person, once with all its roles.
      additionalProperties: false
      required:
        - url
        - title
        - description
        - platform
        - place_type
        - collection
        - locator
        - liveness
        - last_checked_at
        - archived_url
        - roles
      properties:
        url:
          type: string
          description: The link's URL, as entered.
          examples:
            - https://example.org/wren
        title:
          type: [string, "null"]
          examples:
            - Wren's songs
        description:
          type: [string, "null"]
          examples:
            - Recordings and lyrics.
        platform:
          type: [string, "null"]
          description: The site the link is on.
          examples:
            - example.org
        place_type:
          oneOf:
            - $ref: "#/components/schemas/LinkPlaceType"
            - type: "null"
        collection:
          description: The public collection the link belongs to.
          oneOf:
            - $ref: "#/components/schemas/CollectionRef"
            - type: "null"
        locator:
          type: [string, "null"]
          description: Where in the collection the linked item is, such as a page number.
          examples:
            - p. 12
        liveness:
          $ref: "#/components/schemas/Liveness"
        last_checked_at:
          type: [string, "null"]
          format: date-time
          description: When the link was last checked, or null if it never has been.
          examples:
            - "2026-10-01T09:00:00Z"
        archived_url:
          type: [string, "null"]
          description: An archived copy of the linked page.
          examples:
            - https://archive.example.org/2026/https://example.org/wren
        roles:
          type: array
          description: What the link offers, in attachment order.
          items:
            $ref: "#/components/schemas/LinkRole"
      examples:
        - url: https://example.org/wren
          title: Wren's songs
          description: null
          platform: example.org
          place_type: author_site
          collection: null
          locator: null
          liveness: ok
          last_checked_at: "2026-10-01T09:00:00Z"
          archived_url: null
          roles: [website]

    PieceLink:
      type: object
      description: A visible link attached to a piece, once with all its roles, with the performances it records.
      additionalProperties: false
      required:
        - url
        - title
        - description
        - platform
        - place_type
        - collection
        - locator
        - liveness
        - last_checked_at
        - archived_url
        - roles
        - performances
      properties:
        url:
          $ref: "#/components/schemas/PersonLink/properties/url"
        title:
          $ref: "#/components/schemas/PersonLink/properties/title"
        description:
          $ref: "#/components/schemas/PersonLink/properties/description"
        platform:
          $ref: "#/components/schemas/PersonLink/properties/platform"
        place_type:
          $ref: "#/components/schemas/PersonLink/properties/place_type"
        collection:
          $ref: "#/components/schemas/PersonLink/properties/collection"
        locator:
          $ref: "#/components/schemas/PersonLink/properties/locator"
        liveness:
          $ref: "#/components/schemas/Liveness"
        last_checked_at:
          $ref: "#/components/schemas/PersonLink/properties/last_checked_at"
        archived_url:
          $ref: "#/components/schemas/PersonLink/properties/archived_url"
        roles:
          $ref: "#/components/schemas/PersonLink/properties/roles"
        performances:
          type: array
          description: The performances of the piece the link records.
