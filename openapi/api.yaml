          $ref: "#/components/schemas/EntityType"
        current_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 47
        document:
          $ref: "#/components/schemas/EditorDocument"
        summary:
          type: [string, "null"]
          maxLength: 500
          examples:
            - null
      examples:
        - entity_type: event
          current_revision_id: 47
          document:
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.
          summary: null

    ModerationLinkAttachment:
      type: object
      description: |
        An entity a link is attached to, with the link's roles on it; `public` is false for an entity that is
        not public.
      additionalProperties: false
      required: [entity_type, slug, title, public, roles]
      properties:
        entity_type:
          type: string
          enum: [piece, person]
          examples:
            - piece
        slug:
          type: string
          examples:
            - the-copper-kettle
        title:
          type: string
          description: The piece's title or the person's name.
          examples:
            - The Copper Kettle
        public:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/LinkRole"
      examples:
        - entity_type: piece
          slug: the-copper-kettle
          title: The Copper Kettle
          public: true
          roles: [lyrics]

    ModerationLink:
      type: object
      description: A link as moderators see it, hidden or not, with every entity it is attached to.
      additionalProperties: false
      required:
        - link_id
        - url
        - title
        - description
        - platform
        - place_type
        - collection
        - locator
        - liveness
        - is_hidden
        - attachments
        - open_report_count
      properties:
        link_id:
          type: integer
          format: int64
          minimum: 1
          examples:
            - 7
        url:
          type: string
          examples:
            - https://example.org/the-copper-kettle
        title:
          type: [string, "null"]
          examples:
            - The Copper Kettle, sung
        description:
          type: [string, "null"]
          examples:
            - null
        platform:
          type: [string, "null"]
          examples:
            - null
        place_type:
          oneOf:
            - $ref: "#/components/schemas/LinkPlaceType"
            - type: "null"
        collection:
          oneOf:
            - $ref: "#/components/schemas/CollectionRef"
            - type: "null"
        locator:
          type: [string, "null"]
          examples:
            - null
        liveness:
          $ref: "#/components/schemas/Liveness"
        is_hidden:
          type: boolean
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ModerationLinkAttachment"
        open_report_count:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
      examples:
        - link_id: 7
          url: https://example.org/the-copper-kettle
          title: The Copper Kettle, sung
          description: null
          platform: null
          place_type: null
          collection: null
          locator: null
          liveness: ok
          is_hidden: false
          attachments: []
          open_report_count: 0

    SetLinkHiddenRequest:
      type: object
      description: The body of a request to hide or show a link.
      additionalProperties: false
      required: [hidden]
      properties:
        hidden:
          type: boolean
          description: True to hide the link, false to show it again.
          examples:
            - true
      examples:
        - hidden: true

    ReportLinkRequest:
      type: object
      description: The body of a link report.
      additionalProperties: false
      required: [url, reason]
      properties:
        url:
          type: string
          description: The link's URL as a public page shows it, or any spelling that normalizes to it.
          minLength: 1
          maxLength: 2048
          examples:
            - https://example.org/the-copper-kettle
        reason:
          $ref: "#/components/schemas/LinkReportReason"
        message:
          type: [string, "null"]
          maxLength: 2000
          examples:
            - The video has been taken down.
      examples:
        - url: https://example.org/the-copper-kettle
          reason: broken
          message: The video has been taken down.

    LinkReportReceipt:
      type: object
      description: What the reporter of a link learns of their report.
      additionalProperties: false
      required: [id, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          examples:
            - 3
        status:
          $ref: "#/components/schemas/LinkReportStatus"
        created_at:
          type: string
          format: date-time
          examples:
            - "2026-10-01T09:00:00Z"
      examples:
        - id: 3
          status: open
          created_at: "2026-10-01T09:00:00Z"

    LinkReport:
      type: object
      description: A link report as moderators see it, with its link as it is now.
      additionalProperties: false
      required: [id, link, reason, message, reporter, status, created_at, resolved_at, resolved_by, note]
      properties:
        id:
          $ref: "#/components/schemas/LinkReportReceipt/properties/id"
        link:
          $ref: "#/components/schemas/ModerationLink"
        reason:
          $ref: "#/components/schemas/LinkReportReason"
        message:
          type: [string, "null"]
          examples:
            - The video has been taken down.
        reporter:
          $ref: "#/components/schemas/ModerationAuthor"
        status:
          $ref: "#/components/schemas/LinkReportStatus"
        created_at:
          $ref: "#/components/schemas/LinkReportReceipt/properties/created_at"
        resolved_at:
          type: [string, "null"]
          format: date-time
          examples:
            - null
        resolved_by:
          oneOf:
            - $ref: "#/components/schemas/ModerationAuthor"
            - type: "null"
        note:
          type: [string, "null"]
          description: The moderator's resolution note.
          examples:
            - null
      examples:
        - id: 3
          link:
            link_id: 7
            url: https://example.org/the-copper-kettle
            title: null
            description: null
            platform: null
            place_type: null
            collection: null
            locator: null
            liveness: ok
            is_hidden: false
            attachments: []
            open_report_count: 1
          reason: broken
          message: null
          reporter:
            id: google-oauth2|123
            display_name: Morwen
            role: contributor
            blocked: false
          status: open
          created_at: "2026-10-01T09:00:00Z"
          resolved_at: null
          resolved_by: null
          note: null

    LinkReportList:
      type: object
      description: One page of link reports, oldest first, with how many match in all.
      additionalProperties: false
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LinkReport"
        total:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
      examples:
        - data: []
          total: 0

    ResolveLinkReportRequest:
      type: object
      description: The body of a link report's resolution; `hide_link` also hides the report's link.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]
          examples:
            - resolved
        note:
          type: [string, "null"]
          maxLength: 2000
          examples:
            - null
        hide_link:
          type: boolean
          default: false
      examples:
        - status: resolved
          note: null
          hide_link: true

    ContactRequestKind:
      type: string
      description: |
        What a contact request asks for: content removed (`takedown`), a person's page removed or hidden
        (`opt_out`), a correction, or anything else (`general`).
      enum: [takedown, opt_out, correction, general]
      examples:
        - correction

    ContactRequestStatus:
      type: string
      description: Where a contact request is in moderation.
      enum: [open, resolved, dismissed]
      examples:
        - open

    ContactRequestSubmission:
      type: object
      description: |
        The body of a contact request. `name` and `url` are optional; `url` is the page or link the request is
        about, an http or https URL.
      additionalProperties: false
      required: [kind, email, message, turnstile_token]
      properties:
        kind:
          $ref: "#/components/schemas/ContactRequestKind"
        name:
          type: [string, "null"]
          maxLength: 255
          examples:
            - Wren Placeholder
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Where to reply, of the form local@domain, without spaces or control characters.
          examples:
            - wren@example.org
        message:
          type: string
          minLength: 1
          maxLength: 5000
          examples:
            - The second verse of The Copper Kettle is credited to the wrong person.
        url:
          type: [string, "null"]
          maxLength: 2048
          examples:
            - https://bardictorch.org/pieces/the-copper-kettle
        turnstile_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: The token of the form's Turnstile widget, minted for the action `contact`.
          examples:
            - XXXX.DUMMY.TOKEN.XXXX
      examples:
        - kind: correction
          name: Wren Placeholder
          email: wren@example.org
          message: The second verse of The Copper Kettle is credited to the wrong person.
          url: https://bardictorch.org/pieces/the-copper-kettle
          turnstile_token: XXXX.DUMMY.TOKEN.XXXX

    ContactRequestReceived:
      type: object
      description: The answer to a stored contact request. It holds no ID.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [received]
          examples:
            - received
      examples:
        - status: received

    ContactRequest:
      type: object
      description: |
        A contact request as moderators see it. `name`, `email`, `message` and `url` are null once the request is
        `purged`, 180 days after it was resolved or dismissed; `name` and `url` are also null when the sender gave
        none.
      additionalProperties: false
      required: [id, kind, name, email, message, url, status, created_at, resolved_at, resolved_by, note, purged]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          examples:
            - 12
        kind:
          $ref: "#/components/schemas/ContactRequestKind"
        name:
          type: [string, "null"]
          examples:
            - Wren Placeholder
        email:
          type: [string, "null"]
          examples:
            - wren@example.org
        message:
          type: [string, "null"]
          examples:
            - The second verse of The Copper Kettle is credited to the wrong person.
        url:
          type: [string, "null"]
          examples:
            - null
        status:
          $ref: "#/components/schemas/ContactRequestStatus"
        created_at:
          type: string
          format: date-time
          examples:
            - "2026-10-01T09:00:00Z"
        resolved_at:
          type: [string, "null"]
          format: date-time
          examples:
            - null
        resolved_by:
          oneOf:
            - $ref: "#/components/schemas/ModerationAuthor"
            - type: "null"
        note:
          type: [string, "null"]
          description: The moderator's resolution note.
          examples:
            - null
        purged:
          type: boolean
          examples:
            - false
      examples:
        - id: 12
          kind: correction
          name: Wren Placeholder
          email: wren@example.org
          message: The second verse of The Copper Kettle is credited to the wrong person.
          url: null
          status: open
          created_at: "2026-10-01T09:00:00Z"
          resolved_at: null
          resolved_by: null
          note: null
          purged: false

    ContactRequestList:
      type: object
      description: One page of contact requests, newest first, with how many match in all.
      additionalProperties: false
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContactRequest"
        total:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
      examples:
        - data: []
          total: 0

    ResolveContactRequestRequest:
      type: object
      description: The body of a contact request's resolution.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]
          examples:
            - resolved
        note:
          type: [string, "null"]
          maxLength: 2000
          examples:
            - null
      examples:
        - status: resolved
          note: Credit corrected.

    DocumentError:
      type: object
      description: |
        The body of a 422 `invalid_document` response: the document's problems, each at its JSON-pointer-like path
        in the editor format (such as `/links/2/roles`) or at `/summary` or `/base_revision_id`. Neither the
        message nor a problem ever quotes a value.
      additionalProperties: false
      required: [code, message, problems]
      properties:
        code:
          type: string
          enum: [invalid_document]
        message:
          type: string
          examples:
            - the document is invalid
        problems:
          type: array
          minItems: 1
          items:
            type: object
            description: A problem of the document.
            additionalProperties: false
            required: [path, problem]
            properties:
              path:
                type: string
                examples:
                  - /aliases/0/name
              problem:
                type: string
                enum:
                  - required
                  - too_long
                  - invalid_characters
                  - not_nfc
                  - blank
                  - duplicate
                  - unknown_reference
                  - self_reference
                  - cycle
                  - too_deep
                  - wrong_facet
                  - facet_immutable
                  - source_required
                  - reason_required
                  - invalid_url
                  - licence_needs_known_status
                  - date_needs_status
                  - named_needs_person
                  - person_needs_named
                  - credit_to_no_page_person
                  - relation_to_no_page_person
                  - second_primary_term
                  - part_not_allowed
                  - out_of_range
                  - too_many
                  - alias_visibility
                  - withheld_placeholder
                  - withheld_field_changed
                examples:
                  - blank
      examples:
        - code: invalid_document
          message: the document is invalid
          problems:
            - path: /credits/0/person
              problem: unknown_reference

    DuplicateError:
      type: object
      description: The body of a 409 `possible_duplicate` response, with the entities the new one may duplicate.
      additionalProperties: false
      required: [code, message, duplicates]
      properties:
        code:
          type: string
          enum: [possible_duplicate]
        message:
          type: string
          examples:
            - "the new entity may duplicate an existing one: acknowledge_duplicates confirms it"
        duplicates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DuplicateMatch"
      examples:
        - code: possible_duplicate
          message: "the new entity may duplicate an existing one: acknowledge_duplicates confirms it"
          duplicates:
            - entity_type: piece
              slug: the-copper-kettle
              collection_id: null
              name: The Copper Kettle
              matched: title

    Flag:
      type: object
      description: A moderator flag on a revision, with the path of what raised it in the full document, if anything did.
      additionalProperties: false
      required: [code, path]
      properties:
        code:
          $ref: "#/components/schemas/FlagCode"
        path:
          type: [string, "null"]
          examples:
            - /aliases/1/name
      examples:
        - code: hidden_alias_in_text
          path: /notes_md

    FlagsError:
      type: object
      description: |
        The body of a 409 response refusing a moderator's revision for its flags: `unacknowledged_flags`, with the
        flags to acknowledge, or `pending_reference_flagged`, with the flags of the referenced pending revision the
        message names, which must be approved on its own first.
      additionalProperties: false
      required: [code, message, flags]
      properties:
        code:
          type: string
          enum: [unacknowledged_flags, pending_reference_flagged]
        message:
          type: string
          examples:
            - the revision has flags that are not acknowledged
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"
      examples:
        - code: unacknowledged_flags
          message: the revision has flags that are not acknowledged
          flags:
            - code: possible_duplicate
              path: null
