      examples:
        - data: []
          total: 0

    RebaseStatus:
      type: string
      description: |
        What approving a pending revision would do with its document: take it as it is (`not_needed`: it is not
        stale, or cannot be merged), rebase it automatically (`clean`), or refuse until a moderator rebases it
        (`conflicts`).
      enum: [not_needed, clean, conflicts]
      examples:
        - clean

    LinkReportReason:
      type: string
      description: Why a link is reported.
