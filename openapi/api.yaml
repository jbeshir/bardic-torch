        base_revision_id:
          $ref: "#/components/schemas/MyRevisionSummary/properties/base_revision_id"
        submitted_base_revision_id:
          $ref: "#/components/schemas/MyRevisionSummary/properties/submitted_base_revision_id"
        current_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 46
        stale:
          type: boolean
        document:
          $ref: "#/components/schemas/EditorDocument"
        submitted_document:
          oneOf:
            - $ref: "#/components/schemas/EditorDocument"
            - type: "null"
        base_document:
