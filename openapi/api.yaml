  /v1/revisions/{revision_id}:
    get:
      tags:
        - Catalogue
      summary: Get a revision
      description: |
        Returns a public revision: an approved revision of a public entity, with views of its snapshot and of
        its base's (the revision it was based on, if that is an approved revision of the same entity), and the
        names of the snapshot's top-level fields that differ from the base's, or that are not empty if there is
        no base. A view never shows the stored document as such: each reference to another entity is shown as
        that entity is now, and left out if it is not public now; links are shown by URL, and left out if they
        are hidden now; a person's alias appears only if it is public in the snapshot and is a public alias of
        the person now; credits to, performers and relations of persons who are not public or prefer not to have
        a page now are left out; and of a person who prefers not to have a page, now or in the snapshot, only the
        identity is shown. System fields and preference profiles are never shown. `entity_type` says which of
        the five shapes the revision has. A revision that is not approved, or whose entity is not public, is not
        found, exactly like an unknown one. Credentials are ignored.
      operationId: getRevision
      security: []
      parameters:
        - $ref: "#/components/parameters/RevisionID"
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "400":
          description: |
            The `revision_id` is not a positive integer in decimal digits; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid revision_id: must be an integer from 1 to 9223372036854775807"
        "404":
          description: No public revision has this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: revision not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/needs-work:
    get:
      tags:
        - Catalogue
      summary: List entries needing work
      description: |
        Lists one page of the public pieces and persons that need work, pieces first, each by sort key, with how
        many there are in all and how many need work for each reason. A piece needs work if it is a stub, its
        conservation status is unassessed, its licensing is unknown, or a visible link attached to it is dead; a
        restricted piece is listed only if it is a stub. A person needs work if they are a stub, a community bard
        whose licensing is unknown, or a visible link attached to them is dead. Persons who prefer not to have a
        page and hidden links are never considered. Credentials are ignored.
      operationId: listNeedsWork
      security: []
      parameters:
        - name: reason
          in: query
          required: false
          description: Only list entries needing work for this reason. Omitted, entries are listed for any reason.
          schema:
            $ref: "#/components/schemas/NeedsWorkReason"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsWorkList"
        "400":
          description: |
            The `reason` is not a needs-work reason, `limit` or `offset` is out of range, a parameter is given more
            than once, or the query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid reason: not one of its allowed values"
        "500":
          $ref: "#/components/responses/InternalSearch"


  /v1/contact:
    post:
      tags:
        - Contact
      summary: Send a contact request
      description: |
        Sends a message to the moderators through the contact form: a takedown or opt-out request, a correction,
        or anything else. No account is needed; instead `turnstile_token`, from the form's Cloudflare Turnstile
        widget (action `contact`), must pass server-side verification, which runs after the body is validated and
        before anything is stored. The answer holds no ID. The name, email address, message and URL are shown
        only to moderators, in an interactive session, and are never logged; 180 days after a moderator resolves
        or dismisses the request they are deleted. The body may be up to 64 KiB. Credentials are ignored.
      operationId: submitContactRequest
      security: []
      requestBody:
        description: The message, how to reply, and the Turnstile token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequestSubmission"
      responses:
        "202":
          description: The request is stored for the moderators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestReceived"
        "400":
          description: |
            The request body is malformed or invalid (`invalid_request`; the message names the field, never its
            value), or the Turnstile token did not pass: it is missing, invalid, expired, already used, or was
            minted for another site or form (`turnstile_failed`). Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  summary: A field is invalid
                  value:
                    code: invalid_request
                    message: "invalid email: must be an address of the form local@domain, without spaces"
                turnstile:
                  summary: The Turnstile token did not pass
                  value:
                    code: turnstile_failed
                    message: "the turnstile check failed: complete it again and resend"
        "413":
          description: The request body is larger than 64 KiB; the error code is `request_too_large`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: request_too_large
                message: request body is too large
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: |
            The request cannot be taken now, and nothing is stored: the contact form is disabled, Cloudflare failed,
            could not be reached in time or reports a misconfiguration, too many verifications are running, 1000
            requests are already open, or the write could not finish in time. It may be retried later, with a new
            Turnstile token. The error code is `unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unavailable
                message: the contact form is unavailable; try again later

  /v1/pieces/{slug}/editable:
    get:
      tags:
        - Revisions
      summary: Get the editable document of a piece
      description: |
        Returns the document the caller starts an edit of a piece from, in the editor format, with the entities it
        references and the caller's draft and pending revision of it, if any. If the caller has a pending revision
        of the piece, the document is that revision as they see it, on the base it was submitted on
        (`starting_point` `pending`); otherwise it is the current document (`current`). What the caller may not
        see is withheld: hidden aliases and links, everything of a person who prefers not to have a page but
        their identity, and references to entities that are not public. An interactive moderator sees everything
        but preference profiles, with `link_states`; an API token, whatever its user's role, sees what a
        contributor sees. A piece that is neither public nor the caller's own pending new piece (addressed by
        its placeholder slug) is not found, exactly like an unknown one.
      operationId: getPieceEditable
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
