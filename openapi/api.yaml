        created_at:
          $ref: "#/components/schemas/MyRevisionSummary/properties/created_at"
        submitted_at:
          $ref: "#/components/schemas/MyRevisionSummary/properties/submitted_at"
        reviewed_at:
          $ref: "#/components/schemas/MyRevisionSummary/properties/reviewed_at"
        rebased_at:
          type: [string, "null"]
