    EventSnapshot:
      type: object
      description: The view of an event snapshot.
      additionalProperties: false
      required: [name, kind, description_md]
      properties:
        name:
          $ref: "#/components/schemas/EventSummary/properties/name"
        kind:
          $ref: "#/components/schemas/EventKind"
        description_md:
          $ref: "#/components/schemas/Event/properties/description_md"
      examples:
        - name: Midwinter Revel
          kind: event
          description_md: null

    NeedsWorkReason:
      type: string
      description: |
        Why an entry needs work: it is a `stub`; its conservation status is `unassessed`; its licensing is
        unknown (`missing_licensing`); or a visible link attached to it is dead (`dead_links`).
      enum: [stub, unassessed, missing_licensing, dead_links]
      examples:
        - stub

    NeedsWorkList:
      type: object
      description: One page of the public pieces and persons needing work, pieces first, each by sort key.
      additionalProperties: false
      required: [data, total, counts]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NeedsWorkEntry"
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many entries need work for the requested reason, or any reason, in all.
          examples:
            - 1
        counts:
          type: array
          description: How many entries need work for each reason, whatever the requested reason, in the enum's order.
          items:
            $ref: "#/components/schemas/NeedsWorkCount"
      examples:
        - data:
            - entity_type: piece
              slug: the-copper-kettle
              title: The Copper Kettle
              reasons: [stub, missing_licensing]
          total: 1
          counts:
            - reason: stub
              count: 1
            - reason: unassessed
              count: 0
            - reason: missing_licensing
              count: 1
            - reason: dead_links
              count: 0

    NeedsWorkEntry:
      type: object
      description: A public piece or person needing work.
      additionalProperties: false
      required: [entity_type, slug, title, reasons]
      properties:
        entity_type:
          type: string
          description: Whether the entry is a piece or a person.
          enum: [piece, person]
          examples:
            - piece
        slug:
          type: string
          description: The piece's or person's address.
          examples:
            - the-copper-kettle
        title:
          type: string
          description: The piece's title or the person's name.
          examples:
            - The Copper Kettle
        reasons:
          type: array
          description: Every reason the entry needs work, in the enum's order.
          minItems: 1
          items:
            $ref: "#/components/schemas/NeedsWorkReason"
      examples:
        - entity_type: person
          slug: wren-of-the-vale
          title: Wren of the Vale
          reasons: [dead_links]

    NeedsWorkCount:
      type: object
      description: How many entries need work for a reason.
      additionalProperties: false
      required: [reason, count]
      properties:
        reason:
          $ref: "#/components/schemas/NeedsWorkReason"
        count:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 3
      examples:
        - reason: stub
          count: 3

    EntityType:
      type: string
      description: The type of an entity a revision edits.
      enum: [piece, person, term, collection, event]
      examples:
        - piece

    RevisionStatus:
      type: string
      description: |
        Where a revision is in moderation: a `draft` its author has not submitted, `pending` review, `approved`,
        `rejected` by a moderator, or `withdrawn` by its author (or superseded by their later submission).
      enum: [draft, pending, approved, rejected, withdrawn]
      examples:
        - pending

    FlagCode:
      type: string
      description: |
        A moderator flag on a revision. Flags are never shown to a revision's contributor; only moderators see
        and acknowledge them.
      enum:
        - hidden_alias_in_summary
        - hidden_alias_in_text
        - hidden_alias_in_review_note
        - hidden_alias_collision
        - hidden_link_collision
        - hidden_link_attached
        - hidden_data_conflict
        - possible_duplicate
        - references_pending
      examples:
        - possible_duplicate

    DuplicateField:
      type: string
      description: Which of an entity's names a new entity's names matched; never a hidden alias.
      enum: [title, alias, name, url]
      examples:
        - title

    EditorSlug:
      type: string
      description: |
        The slug of a piece, person, term or event the document references, or of the caller's own pending new
        term or person (a placeholder slug).
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 191
      examples:
        - the-copper-kettle

    EditorText:
      type: [string, "null"]
      description: Markdown or plain text, at most 65535 bytes.
      examples:
        - Sung at every revel since the founding of the barony.

    EditorPerformance:
      type: object
      description: A performance a link records, with its event and performers by slug.
      additionalProperties: false
      required: [event, year, uploader, description_verbatim, performers]
      properties:
        event:
          oneOf:
            - $ref: "#/components/schemas/EditorSlug"
            - type: "null"
        year:
